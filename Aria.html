        padding-top: 4em;

        box-shadow: 0 2px 6px -1px hsla(0, 0%, 0%, 0.16), 0 1px 4px -1px hsla(0, 0%, 0%, 0.04);
        border-radius: .5rem;
        margin: 20px auto;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
    }

    .card {
        display: flex;
        flex-flow: column;
    }

    .pic {
        overflow: hidden;
    }

    .pic img {
        inline-size: 100%;
        /*max-width: 100%;
        aspect-ratio: 16/9;*/
        aspect-ratio: 1;
        object-fit: cover;
        display: block;
        transition: scale .5s ease-in-out;
    }

    .card:hover .pic img,
    .card:focus-within .pic img {
        scale: 1.15;
    }

    .content {
        flex: 1;
        padding: 1rem;
        border: 1px solid #efefef;
        border-block-start: none;
        background: #fff;
    }

    .title {
        font-size: clamp(1rem, 1rem + .5cqi, 1.25rem);
        line-height: 1.4;
        font-weight: 700;
        color: #282c3f;
        margin-block-end: .15rem;
    }

    .author {
        font-size: .875rem;
        font-weight: 400;
        color: #737686;
        margin-block-end: .5rem;
    }

    .desc {
        display: none;
    }

    .btn-play {
        border: none;
        border-radius: .25rem;
        padding: .5em 1.25em;
        color: #fa3361;
        cursor: pointer;
        outline: 1px solid transparent;
        outline-offset: 2px;
        transition: outline .5s ease-in-out;
    }

    .btn-play:hover,
    .btn-play:focus-visible {
        outline-color: currentColor;

    }

    @container (inline-size > 300px) {
        .cards {
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        }
    }
</style>
