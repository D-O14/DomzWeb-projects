<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    body{
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.6;
        word-spacing: 1.4px;
        height: 100vh;
    }

    .container{
        display: grid;
        border: 10px solid black;
        grid-template-rows: repeat(4, 100px);
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        /*grid-template-columns: 1fr 1fr 300px 300px;*/
                
    }

    .item{
        background: #fb7185;
        padding: 1em;
        font-weight: 700;
        color: #fff;
        text-align: center;
        border: 10px solid #fe2545;
        border-radius: 10px;
    }

    /*.item-1{
        grid-row: 1 / 3;
        grid-column: 1 / 4;
        /*grid-row-start: 1;
        grid-row-end: 3;
        grid-column-start: 1;
        grid-column-end: 5;
    }

    .item-2{
        grid-row: span 2;
        grid-column: span 2;
        /*grid-row-start: 1;
        grid-row-end: 3;
        grid-column-start:4;
        grid-column-end: 6;
    }

    .item-3{
        grid-area: 3 / 1 / 6 / 6;
    }*/


</style>

<body>

    <main>
        <div class="container">
            <div class="item item-1">1</div>
            <div class="item item-2">2</div>
            <div class="item item-3">3</div>
            <div class="item item-4">4</div>
        </div>
    </main>


</body>

</html>
