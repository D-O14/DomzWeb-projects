<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
    }


    .container{
        display: grid;
        grid-template-rows: repeat(6, 100px);
        grid-template-columns: repeat(6, 100px);
        grid-auto-flow: row;
        grid-gap: 1em;
        /*grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));*/
    }

    .item{
        background: hsl(221, 85%, 70%);
        padding: 1em;
        font-weight: 700;
        color: #fff;
        text-align: center;
        border: 10px solid hsl(231, 79%, 50%);
        border-radius: 10px;
    }

    .item-1{
        grid-row: 1 / 3;
        grid-column: 1 / 5;
    }

    .item-2{
        grid-row: 3 / 1;
        grid-column: 5 / 7;
    }

    .item-3{
        grid-area: 3 / 1 / 7 / 5;
    }

    .item-4{
        grid-area: 3 / 5 / 7 / 7;
    }

    .item-5{
        grid-row: span 2;
        grid-column: span 4;
    }

    .item-6{
        grid-row: span 2;
        grid-column: span 3;
    }

    .item-7{
        grid-row: 9 / -1 ;
        grid-column: span 7;
    }

    .item-8{
        grid-row: 7 / 1;
    }
</style>

<body>

    <main>
        <div class="container">
            <div class="item item-1">item-1</div>
            <div class="item item-2">item-2</div>
            <div class="item item-3">item-3</div>
            <div class="item item-4">item-4</div>
        </div>
    </main>


</body>

</html>
