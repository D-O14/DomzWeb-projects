<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

body{
    /*background: rgb(from red calc(r/2) 120 225); 255 0 0*/
    background: oklch(from blue l c h); /*255 0 0*/
}

button[popovertarget]{
    background: dodgerblue;
    padding: .5rem 1rem;
    border: none;
    border-radius: 4px;
    color: #fff;
}

#popover_form{
    border: 1px inset #333;
    border-radius: 8px;
    padding: 1rem 2rem;
    background: none;
    font-family: sans-serif;

    & button{
        background: dodgerblue;
        padding: .5rem 1rem;
        border: none;
        border-radius: 4px;
        color: #fff;
    }

    & input{
        border: 1px solid;
        border-radius: 3px;
        padding: .5rem 1rem;
    }

}
</style>

<body>

    <main>
        <div class="modal">
            <form action="" popover="manual" id="popover_form">
                <h1>Login here</h1>
                <input type="text" placeholder="Name" id="">
                <button type="submit">submit</button>
            </form>
        </div>
        <button popovertarget="popover_form">open modal</button>
    </main>

</body>

</html>
