<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html{ 
        scroll-behavior: smooth;
        overflow-y: hidden;
    }

    body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.6;
        word-spacing: 1.4px;
        height: 100vh;
        color: hsl(0, 0%, 95%);
    }

    a {
        color: hsl(0, 0%, 85%);
        transition: .3s ease;
    }

    button{
        color: hsl(0, 0%, 95%);
    }

    a:hover {
        color: hsl(0, 0%, 95%);
    }

    nav {
        background: hsl(0, 0%, 5%);
        padding: .2em 1.5em;
    }

    .nav-container {
        max-width: 1200px;
        display: flex;
        margin: auto;
        align-items: center;
        justify-content: space-between;
    }

    ul {
        display: flex;
        gap: 1.75em;
        justify-content: space-evenly;
    }

    ul li {
        list-style: none;
        font-weight: 500;
    }

    ul li a {
        text-decoration: none;
    }

    .btn {
        background: hsl(220, 100%, 56%);
        padding: .5em 1em;
        font-weight: 600;
        border: none;
        font-size: .9rem;
        border-radius: 6px;
        transition: background .3s ease;
    }

    .btn-2:hover{
        background: hsl(220, 100%, 36%);
        color: hsl(0, 0%, 75%);
    }

    .btn-1 {
        background: transparent;
        border: 1px solid hsl(0, 0%, 50%);
    }

    .btn-1:hover{
        background: hsl(0, 0%, 95%);
        color: hsl(0, 0%, 5%);
    }

    .btnBox {
        display: flex;
        gap: 1em;
        margin-left: 1.5rem;
    }

    section{
        position: relative;
        min-height: 100vh;
    }

    .hero-img img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 80%;
        object-fit: cover;
    }

    /*.container{
        display: grid;
        border: 10px solid black;
        grid-template-rows: repeat(4, 100px);

        grid-template-columns: 1fr 1fr 300px 300px;
                
    }

    .item{
        background: #fb7185;
        padding: 1em;
        font-weight: 700;
        color: #fff;
        text-align: center;
        border: 10px solid #fe2545;
        border-radius: 10px;
    }

    .item-1{
        grid-row: 1 / 3;
        grid-column: 1 / 4;
        /*grid-row-start: 1;
        grid-row-end: 3;
        grid-column-start: 1;
        grid-column-end: 5;
    }

    .item-2{
        grid-row: span 2;
        grid-column: span 2;
        /*grid-row-start: 1;
        grid-row-end: 3;
        grid-column-start:4;
        grid-column-end: 6;
    }

    .item-3{
        grid-area: 3 / 1 / 6 / 6;
    }*/
</style>

<body>

    <main>

        <header>
            <nav>
                <div class="nav-container">
                    <h1>DomzWeb</h1>
                    <ul>
                        <li><a href="">Home</a></li>
                        <li><a href="">About</a></li>
                        <li><a href="">Services</a></li>
                        <li><a href="">Blog</a></li>
                        <li><a href="">NewsLetter</a></li>
                    </ul>
                    <div class="btnBox">
                        <button class="btn btn-1">Login</button>
                        <button class="btn btn-2">Sign Up</button>
                    </div>
                </div>
            </nav>
        </header>

        <section>
            <div class="hero-img">
                <img src="codes\images\sea.jpg" alt="">
            </div>
        </section>
    </main>


</body>
