<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        @media (prefers-color-scheme: dark){
            body{
                background: #0f0f0f;
                color: #f5f5f5;
            }
        }

        @media (prefers-color-scheme: light){
            body{
                background: white;
                color: #111;
            }
        }

        @media (prefers-reduced-motion: reduce){
            *{
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto;
            }
        }

        @media (prefers-contrast: more){
            body{
                color: black;
                background: white;
            }

            a{
                text-decoration: underline;
            }
        }

        @media (prefers-contrast: less){
            body{
                color: #444;
            }
        }

        @media (forced-colors: active){
            button{
                border: 2px solid ButtonText;
                background: ButtonFace;
                color: ButtonText;
            }

            @media(prefers-reduced-transparency: reduce){
                body{
                    -webkit-backdrop-filter: none;
                    backdrop-filter: none;
                    background: #111;
                }
            }

            @media (prefers-reduced-data: reduce){
                video,img{
                    display: none;
                }
            }
        }

        @media (pointer: coarse){
            button{
                padding: 1rem;
            }
        }

        @media (color-gamut: p3){
            body{
                background: color(display-p3 1 0 0);
            }
        }

        @media (monochrome){
            body{
                background: white;
                color: black;
            }
        }
    </style>
<body>

    <header></header>

    <nav>

    </nav>

    <aside>

    </aside>

    <main>

        <form action="" data-form>
            <input type="text" required placeholder="Name" name="input_form" autofocus>
            <button type="submit" title="A submit button">Save</button>
        </form>

        <div data-container aria-live="polite"></div>
        <img src="" alt="Img description">
        <a href="#">Click me</a>

    </main>

</body>

<script>
    const form = document.querySelector("[data-form]")
    form.addEventListener("submit", e => {
        e.preventDefault()
        const container = document.querySelector("[data-container]")
        const div = document.createElement("div")
        div.innerText = "Saved data"
        container.append(div)
    })
</script>

</html>

<!--aria-expanded = "false" or "true" ( Can be used for hamburger menus with JS )
    Ex: if(this.getAttribute('aria-expanded') == 'false' ){
    this.getAttribute('aria-expanded', 'true');
    }
    aria-label = "Text" ( For icons and others )
    aria-labelledby = { ID of image caption }
    role = changes semantics of an element
    focus-visible
    label for content id
    scrollable-content = tabindex=0-->
