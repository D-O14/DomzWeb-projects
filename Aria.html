    .animate{
        animation: 1s both;
    }

    .animate-infinite{
        animation: infinite;
    }
    .animate-delay{
        animation-delay: 1s;
    }

    .animate-fast{
        animation: .6s;
    }

    .animate-slow{
        animation: 3s;
    }

    @keyframes slide{
        from {
            transform: translateX(-300px);
        }

        to{
            transform: translateX(0);
        }
    }

    .slide{
        /*animation: slide 2s ease .5s infinite alternate-reverse;*/
        animation-name: slide;
        animation-timing-function: ease-in;
