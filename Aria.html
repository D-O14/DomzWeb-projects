<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

button[popovertarget]{
    background: dodgerblue;
    padding: .5rem 1rem;
    border: none;
    border-radius: 4px;
    color: #fff;
}

#popover_form{
    border: 1px inset #333;
    border-radius: 8px;
    padding: 1rem 2rem;
    background: none;
    font-family: sans-serif;

    & button{
        background: dodgerblue;
        padding: .5rem 1rem;
        border: none;
        border-radius: 4px;
        color: #fff;
        margin-left: 20px;
    }

    & input{
        display: flex;
        flex-direction: column;
        border: 1px solid;
        border-radius: 3px;
        padding: .5rem 1rem;
        margin: .75rem;
    }

}

</style>

<body>

    <main>
        <div class="modal">
            <form action="" popover="manual" id="popover_form">
                <h1>Login here</h1>
                <input type="text" placeholder="Name" id="">
                <input type="password" placeholder="Password" id="">
                <input type="email" placeholder="E-mail" id="">
                <input type="date" placeholder="Birthday" id="">
                <button type="submit">Submit</button>
            </form>
        </div>
        <button title="Open Modal button" popovertarget="popover_form">open modal</button>

        </main>

</body>

</html>
