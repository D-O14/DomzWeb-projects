    form {
        width: 50%;
        padding: 12px 20px;
        background: hsl(0, 0%, 98%);
        box-shadow: 0 2px 6px -1px hsla(0, 0%, 0%, 0.16), 0 1px 4px -1px hsla(0, 0%, 0%, 0.04);
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 20px auto;
        gap: 1rem;
    }

    label {
        display: flex;
        flex-direction: column;
        gap: .5rem;
    }

    input,
    textarea {
        width: 40vmax;
        border: 1px solid hsl(0, 0%, 60%);
        border-radius: .25rem;
        padding: .5rem .75rem;
    }

    input:invalid{
        border: 2px solid hsl(360, 80%, 50%);
    }

    input:valid{
        border: 2px solid hsl(100, 80%, 50%);
    }

    input:focus{
        outline: none;
    }

    textarea:focus{ 
        outline: 1px solid hsl(0, 0%, 40%)
    }

    textarea::placeholder{
        font-weight: 100;
        color: hsl(0, 0%, 60%);
    }

    legend {
        font-size: 40px;
        align-self: center;
        text-decoration: underline;
        text-underline-offset: 10px;
    }

    button {
        padding: .5em 1em;
        border: 1px inset hsla(0, 0%, 0%, 0.16);
        color: hsl(0, 0%, 95%);
        background: hsl(210, 70%, 50%);
        border-radius: 4px;
        transition: .5s ease;
    }

    button:hover{
        background: hsl(210, 70%, 30%);
    }

    .help-trigger {
        anchor-name: --help;
        background: hsl(0, 0%, 15%);
        color: hsl(0, 0%, 90%);
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        font-size: 12px;
        cursor: pointer;
        vertical-align: middle;
        margin-left: 4px;
    }

    [popover] {
        margin: 0;
        padding: .5em .75em;
        border: none;
        background: hsl(0, 0%, 5%);
        color: hsl(0, 0%, 95%);
        border-radius: 6px;
        font-size: 14px;
        max-width: 220px;
        position-anchor: --help;
        position-area: bottom right;
        position-try-fallbacks: flip-block, flip-inline;
    }

            <div>

                    <label for="name">Full Name
