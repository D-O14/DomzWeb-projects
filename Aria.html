<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
    }

    body {
        font-size: clamp(1rem, 1.2vw, 1.125rem);
        min-height: 100dvh;
        font-family: "Roboto", sans-serif;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300, 1fr));
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
            "header header"
            "navbar navbar"
            "main main"
            "footer footer";  
        background: hsl(0,0%,100%);
        line-height: 1.5;
        margin-bottom: 1lh;
    }

    nav {
        display: flex;
        position: relative;
        top: -750px;
        grid-area: navbar;
        justify-content: center;
        /*background: hsl(0,0%,90%);*/
        width: 1200px;
        margin: auto;
        border-radius: .75em;
        /*border: 1px solid hsl(0,0%,80%);
        box-shadow: 1px 1px 1px  hsl(0,0%,8%)*/

        & h1{
            color: hsl(0,0%,95%);
            font-size: clamp(1rem, 3rem, 2rem);
            font-style: italic;
        }
    }

    span{
        color: hsl(210, 80%, 50%);
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    a{
        text-decoration: none;
        color: hsl(0,0%,90%);
        transition: .3s ease;
        font-style: italic;

        &:hover{
            color: hsl(0,0%,95%);
            font-weight: 600;
        }
    }

    .active{
        color: hsl(0,0%,95%);
        font-weight: 600;
        font-style: italic;
    }

    li{
        list-style: none;
    }
    button{
        border: none;
        padding: .5em 1em;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
    }
   
    .btn{
        background: hsl(210, 80%, 50%);
        color: hsl(0,0%,90%);
        transition: .3s ease;
    }

    .btn:hover{
        background: hsl(210, 100%, 40%);
    }

    .btn-disabled:disabled{
        color: hsl(0,0%,30%);
        background: hsl(0,0%,20%);
        cursor: not-allowed;
    }

    .nav-container{
        /*position: relative;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;*/
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        gap: 5rem;

        & form input[type="search"]{
            outline: none;
            border: none;
            padding: .5rem 1rem;
            border-radius: 5px;
        }

        & form input[type="search"]::placeholder{
            color: hsl(0,0%,75%);
            font-style: italic;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }    

        & form input[type="search"]:focus{
            border: 2px solid hsl(0,0%,90%);

        }

        & form input[type="search"]::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            border: 2px solid hsl(5, 0%, 80%);
            transition: .3s ease;
        }

        & form input[type="search"]:hover::before,
        & form input[type="search"]:focus::before {
            top: calc(2px * -2);
            left: calc(2px * -2);
            right: calc(2px * -2);
            bottom: calc(2px * -2);
        }
        
    }

    .menu{
        display: flex;  
        gap: 1rem;
    }

    .btnBox{
        display: flex;
        gap: .5em;
    }

    main {
        grid-area: main;
    }

    .img-container{
        height: 100vh;
    }

    img{
        width: 100%;
        height: auto;
        object-fit: cover;
    }

    footer {
        grid-area: footer;
    }

    }

    @media(max-width:768px){

        }
        aside{
            position: fixed;
            width: 300px;
            display: none;
        }
        .show{
            display: block;
        }
    }*/

</style>

<body>
    <main>
        <div class="img-container">
            <img src="codes/images/space (9).jpg" alt="" srcset="">
        </div>
        <nav>
            <h1>Domz<span>Web</span></h1>
            <div class="nav-container">
                <form action="">
                    <input type="search" name="" id="" aria-label="Search" placeholder="Find anything....">
                </form>
                <ul class="menu">
                    <li><a href="" class="active">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">Newsletter</a></li>
                </ul>
                <div class="btnBox">
                    <button class="btn">Sign Up</button>
                    <button class="btn-disabled" disabled>Login</button>
                </div>
            </div>
            </nav>
    </main>
    <footer>footer</footer>
