<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Creation Form</title>
  <script type="module" crossorigin src="/DomzWeb-projects/assets/src\Projects\account\form\account-form-fHUo66zl.js"></script>
  <link rel="modulepreload" crossorigin href="/DomzWeb-projects/assets/modulepreload-polyfill-DS6cw923.js">
  <link rel="modulepreload" crossorigin href="/DomzWeb-projects/assets/icons-Cghu45S2.js">
  <link rel="stylesheet" crossorigin href="/DomzWeb-projects/assets/account-form-BViU5x3B.css">
</head>

<body>
    <div class="container">
        <div class="image">
            <img src="/DomzWeb-projects/assets/abstract-waves-DCiNSxYh.jpg" alt="decorative image" loading="lazy" width="500px"
                height="600px">
            <div class="image-text">
                <span class="icon" data-icon="planetLogo"></span>
                <p>Access your workspace anywhere, anytime.</p>
            </div>
        </div>
        <div class="form">
            <form method="post" enctype="multipart/form-data" novalidate autocomplete="on" autocorrect="on"
                spellcheck="true" autocapitalize="on">
                <div class="form-heading">
                    <h1>Create an account</h1>
                    <p>And integrate into a new <a href="#">Ecosystem</a></p>
                </div>
                <div class="input-group">
                    <label>
                        <div class="input">
                            <span class="icon" data-icon="user"></span>
                            <span class="top"></span>
                            <span class="left"></span>
                            <input type="text" placeholder="R$ndomJ-ohn12" enterkeyhint="next" required id="username"
                                name="username" pattern="^[A-Za-z0-9\s'.@\$\-]+$" autofocus>
                            <span class="right"></span>
                            <span class="bottom"></span>
                        </div>
                        <!--<span class="error-icon icon" data-icon="exclaim"></span>-->
                        <p class="error-text" aria-live="polite"></p>
                    </label>
                    <label>
                        <div class="input">
                            <span class="icon" data-icon="atSymbol"></span>
                            <span class="top"></span>
                            <span class="left"></span>
                            <input type="text" placeholder="@johndoe" enterkeyhint="next" required id="handle"
                                name="handle" pattern="^[A-Za-z0-9@.\-\s]*">
                            <span class="right"></span>
                            <span class="bottom"></span>
                        </div>
                        <p class="error-text" aria-live="polite"></p>
                    </label>
                </div>
                <label>
                    <div class="input">
                        <span class="icon" data-icon="mail"></span>
                        <span class="top"></span>
                        <span class="left"></span>
                        <input type="email" placeholder="jonathandoe@gmail.com" enterkeyhint="next" required id="email"
                            name="email" inputmode="email">
                        <span class="right"></span>
                        <span class="bottom"></span>
                    </div>
                    <p class="error-text" aria-live="polite"></p>
                </label>
                <label>
                    <div class="input">
                        <span class="icon" data-icon="phone"></span>
                        <span class="top"></span>
                        <span class="left"></span>
                        <input type="tel" placeholder="+144 500 391 065" enterkeyhint="next" required id="contact"
                            name="contact" pattern="^[+?0-9\s\-]{7,17}" inputmode="tel" maxlength="17">
                        <span class="right"></span>
                        <span class="bottom"></span>
                    </div>
                    <p class="error-text" aria-live="polite"></p>
                </label>
                <label>
                    <div class="input">
                        <span class="icon" data-icon="userLock"></span>
                        <span class="top"></span>
                        <span class="left"></span>
                        <input type="password" placeholder="P-@$_sw0rd" enterkeyhint="next" required id="password"
                            name="password" maxlength="12" pattern="[0-9A-Za-z@_!$&%?\-]*">
                        <span class="right"></span>
                        <span class="bottom"></span>
                        <span class="icon toggle" data-icon="eyeOn"></span>
                    </div>
                    <div class="password-box">
                        <span class="icon" data-icon="shield"></span>
                        <div class="content">
                            <h3>Suggest a strong password</h3>
                            <p>And save to your Google account</p>
                        </div>
                    </div>
                    <p class="error-text" aria-live="polite"></p>
                </label>
                <label>
                    <textarea placeholder="Tell us a bit about yourself (optional)" enterkeyhint="done" maxlength="200"
                        name="bio"></textarea>
                    <p class="chars" aria-live="polite"></p>
                </label>
                <button class="submitBtn">
                    <span class="button-text">
                        Create Account
                    </span>
                    <span class="icon" data-icon></span>
                </button>
                <menu>
                    <button class="loginBtn" type="button">
                        <span class="text">Google</span>
                        <span class="icon" data-icon="google"></span>
                    </button>
                    <button class="loginBtn" type="button">
                        <span class="text">Apple</span>
                        <span class="icon" data-icon="apple"></span>
                    </button>
                </menu>
            </form>
        </div>
    </div>
</body>


</html>
