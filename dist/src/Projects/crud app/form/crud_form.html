<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CRUD App Form</title>
  <script type="module" crossorigin src="/DomzWeb-projects/assets/modulepreload-polyfill-DS6cw923.js"></script>
  <script type="module" crossorigin src="/DomzWeb-projects/assets/crud_form-BWvFsteG.js"></script>
  <link rel="stylesheet" crossorigin href="/DomzWeb-projects/assets/crud_form-vrJeFHsP.css">
</head>

<body>
    <main>
        <section>
            <form action="/" method="get" target="_self" spellcheck="true" autocomplete="off"
                enctype="application/x-www-form-urlencoded">
                <label for="name">
                    <div class="label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-user">
                            <path d="M17.925 20.056a6 6 0 0 0-11.851.001" />
                            <circle cx="12" cy="11" r="4" />
                            <circle cx="12" cy="12" r="10" />
                        </svg>
                        Name:
                    </div>
                    <input type="text" id="name" placeholder="John Doe" required name="Name" autofocus
                        enterkeyhint="next">
                </label>

                <label for="email">
                    <div class="label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-mail-icon lucide-mail">
                            <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                        </svg>
                        E-mail:
                    </div>
                    <input type="email" id="email" placeholder="Your_email@gmail.com" required name="E-mail"
                        enterkeyhint="next" inputmode="email">
                </label>

                <label>
                    Gender:
                    <div class="gender">
                        <label class="male" for="male">
                            <input type="radio" name="gender" id="male" value="Male">
                            Male
                        </label>
                    
                        <label class="female" for="female">
                            <input type="radio" name="gender" id="female" value="Female">
                            Female
                        </label>
                    </div>
                </label>
                
                
                <label for="dob">
                        <div class="label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-calendar-days-icon lucide-calendar-days">
                                <path d="M8 2v4" />
                                <path d="M16 2v4" />
                                <rect width="18" height="18" x="3" y="4" rx="2" />
                                <path d="M3 10h18" />
                                <path d="M8 14h.01" />
                                <path d="M12 14h.01" />
                                <path d="M16 14h.01" />
                                <path d="M8 18h.01" />
                                <path d="M12 18h.01" />
                                <path d="M16 18h.01" />
                            </svg>
                            Date of Birth:
                        </div>
                        <input type="date" id="dob" placeholder="DD-MM-YYYY" required name="date" enterkeyhint="next">
                    </label>
 
                    <label for="password">
                        <div class="label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                <circle cx="12" cy="16" r="1" />
                                <rect x="3" y="10" width="18" height="12" rx="2" />
                                <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                            </svg>
                            Password:
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="P@$sw0rd" required name="Password" minlength="6"
                                maxlength="12" enterkeyhint="next">
                            <button type="button" id="pass_toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-eye-icon lucide-eye">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </label>
                    
                    <label for="confirm_password">
                        <div class="label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                <circle cx="12" cy="16" r="1" />
                                <rect x="3" y="10" width="18" height="12" rx="2" />
                                <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                            </svg>
                            Confirm Password:
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="confirm_password" placeholder="[Password]" required name="confirm_password"
                                minlength="6" maxlength="12" enterkeyhint="done">
                            <button type="button" id="confirmPass_toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-eye">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </label>
            
                <button type="submit" class="formBtn" id="submit">
                    <span class="btn">Submit</span>
                </button>
            </form>
        </section>
    </main>

</body>

</html>
