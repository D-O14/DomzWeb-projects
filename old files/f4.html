<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="f4.css">

<body>
    <div id="container">
        <h1>Login menu</h1>

        <label for="username"></label>
        <i class="fa-solid fa-user"></i>
        <input type="text"  placeholder="Username" minlength="6" maxlength="12" required><br>

        <label for="password"></label>
        <i class="fa-solid fa-lock"></i>
        <input type="text" placeholder="Password" minlength="6" maxlength="12" required><br>

        <a href="">Forgot password?</a><br> 
        <p style="margin-bottom: 20px; margin-top: 0px;"></p>

        <h2><button type="submit" value="submit">Log in</button></h2>
        <h3>Don't have an account?<a href="">Register</a></h3>

    </div>
</body>

</html>
