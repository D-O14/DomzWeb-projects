<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="error.css">
    <script defer src="error.js"></script>
</head>
<body>
    <div class="container">
        <form action="" id="form">
            <h1>Registration</h1>
            <div class="input-control">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"  minlength="4" required>
                <div class="error"></div>
            </div>
            <div class="input-control">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <div class="error"></div>
                <div class="input-control">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <p>Password must be at least 6 characters, no symbols or special characters.</p>
                    <div class="error"></div>
                </div>
                <div class="input-control">
                    <label for="password">Confirm Password</label>
                    <input type="password"  id="password2" name="password2" required minlength="6">
                    <div class="error"></div>
                </div>
                <button type="submit" onclick="showToast(successMsg)">Sign Up</button>
            </div>
        </form>
    </div>
    <div id="toastBox"></div>
</body>
</html>
