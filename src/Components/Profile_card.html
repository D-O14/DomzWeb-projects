<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease-in-out;
    }

    body{
        background: hsl(0, 0%, 0%);
    }

    section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    article {
        width: 100%;
        max-width: 450px;
        color: hsl(0, 0%, 90%);
        box-shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        border-radius: .5rem;
        border: 1px solid hsl(0, 0%, 15%);
        margin-top: 200px;
    }

    .card-header {
        position: relative;
    }

    .card-body {
        padding: 3rem 1rem 1rem;
        gap: 1rem;
        margin: 10px;
        display: flex;
        flex-direction: column;
    }

    img {
        width: 100%;
        height: auto;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-top-left-radius: .5rem;
        border-top-right-radius: .5rem;
    }

    img:nth-of-type(1) {
        height: 150px;
    }

    img:nth-of-type(2) {
        position: absolute;
        left: 16px;
        bottom: -40px;
        border-radius: 4rem;
        border: 4px solid hsl(0, 0%, 0%);
        width: 80px;
        height: 80px;
    }

    button {
        border-radius: .5em;
        padding: .5em 1em;
        border: none;
        position: absolute;
        right: 16px;
        bottom: -20px;
        font-weight: 500;
    }

    .handle a {
        color: hsl(210, 80%, 45%);
        font-style: italic;
        text-decoration: none;
        font-size: .95rem;
    }

    .badge {
        position: absolute;
        top: 10px;
        left: 16px;
        font-size: .95rem;
        padding: .25em .5em;
        background: hsl(210, 80%, 50%);
        color: hsl(0, 0%, 90%);
        border-radius: .25rem;
        font-weight: 500;
        letter-spacing: .5px;
    }
</style>

<body>
    <main>
        <section>
        <article>
                <div class="card-header">
                    <img src="/public/assets/images/Hotel_items (2).jpg" alt="" class="cover">
                    <img src="/public/assets/images/cafe_items (1).jpg" alt="" class="pfp">
                    <button>Follow</button>
                    <span class="badge">Admin</span>
                </div>
                <div class="card-body">
                    <div class="handle">
                        <h3>Domzski</h3>
                        <a href="#">@domzweb</a>
                    </div>
                    <p>Upcoming Web Developer and UI/UX Expert.</p>
                </div>
            </article>

        </section>
    </main>
</body>

</html>
