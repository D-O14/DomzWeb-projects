<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domz Cafe - Expo</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease-in-out;
    }

    section {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    article {
        display: flex;
        flex-direction: column;
        box-shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        max-width: 350px;
        width: 100%;
        margin-top: 200px;
        gap: .5rem;
        border-radius: 10px;
    }

    h4 {
        font-weight: 400;
    }

    menu {
        display: flex;
        gap: 1rem;
    }

    button {
        padding: .5em 1em;
        border: none;
        border-radius: .5rem;
        font-weight: 500;
        color: hsl(0, 0%, 90%);
        background: hsl(250, 80%, 50%);
    }

    a {
        text-decoration: none;
        color: hsl(0, 0%, 0%);
        display: inline-block;
        padding: .25em .5em;
        border: 1px solid hsl(0, 0%, 80%);
        border-radius: .5rem;
    }


    img {
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        display: block;
        object-fit: cover;
    }

    .card-header {
        position: relative;
    }

    .pfp {
        position: absolute;
        border-radius: 4rem;
        border: 4px solid hsl(0, 0%, 100%);
        width: 100px;
        height: 100px;
        bottom: -40px;
        left: 125px;
    }

    .header {
        border-top-left-radius: .5em;
        border-top-right-radius: .5em;
        height: 200px;
        background: hsl(250, 80%, 50%);
    }

    .card-body {
        padding: 3rem 1rem 1rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin: 10px;
    }

    span {
        font-weight: 500;
    }

    .stats {
        display: flex;
        gap: .5rem;
    }

    .socials {
        display: flex;
        justify-content: center;
        gap: .25rem;
    }
</style>

<body>
    <main>
        <section>
            <article>
                <div class="card-header">
                    <div class="header"></div>
                    <img src="/public/assets/images/cafe_items (1).jpg" alt="" class="pfp">
                </div>
                <div class="card-body">
                    <div class="handle">
                        <h1>DomzWeb</h1>
                        <h4>Web Developer</h4>
                    </div>
                    <div class="socials">
                        <a href="">Twitter</a>
                        <a href="">Facebook</a>
                        <a href="">Instagram</a>
                        <a href="">YouTube</a>
                    </div>
                    <menu>
                        <button>Follow</button>
                        <button>Message</button>
                    </menu>
                    <div class="stats">
                        <span>60.4k</span>&verbar;
                        <span>20k</span>&verbar;
                        <span>12.4k</span>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
