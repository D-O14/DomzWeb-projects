<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *::before,
    *::after,
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    :root{
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    button {
        border: 2px solid transparent;
        border-radius: .25rem;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        cursor: pointer;
    }

    article{
        width: 300px;
        height: 500px;
        border-radius: 1.5rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    figure{
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 1.5rem;
    }
    
    figure:hover img{
        scale: 1.1;
    }

    img{
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: 1.5rem;
    }

    h1{
        font-size: 1.25rem;
        font-weight: 500;
        color: hsl(0, 0%, 90%);
    }

    .price{
        color: hsl(0, 0%, 80%);
        font-size: 1rem;
        font-weight: 400;
    }

    .card{
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        width: 100%;
        height: auto;
        padding: 2em 2em 2em;
        background: hsl(13, 46%, 25%);
        border-radius: 1.5rem;
    }

    .details{
        display: flex;
        flex-direction: column;
    }

    .buyBtn{
        color: hsla(0, 0%, 85%, .8);
        background: none;
        border: 2px solid hsla(0, 0%, 85%, .8);
        border-radius: 1.25rem;
    }

    .buyBtn:hover{
        color: hsl(0, 0%, 85%);
        border: 2px solid hsl(0, 0%, 85%);
    }
</style>
<body>
    <article>
        <figure>
            <img src="/public/assets/images/cafe_items (10).jpg" alt="an abstract image">
        </figure>
        <div class="card">
            <div class="details">
                <h1>Product Name</h1>
                <span class="price">$22.50</span>
            </div>
            <menu>
                <button class="buyBtn">Buy now</button>
            </menu>
        </div>
    </article>
</body>
</html>
