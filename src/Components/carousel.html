<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel component</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: all .3s ease;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    html {
        scroll-behavior: smooth;
    }

    body{
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border: 2px solid;
    }

    h1{
        font-size: 1.25rem;
        font-weight: 500;
    }

    .carousel{
        display: flex;
        align-items: center;
        overflow-x: auto;
        max-width: 1000px;
        gap: 1em;
        padding: 2em;
    }

    ::-webkit-scrollbar{
        display: none;
    }

    .img-card{
        flex: 1 0 300px;
        border-radius: .5em;
        box-shadow: var(--shadow);
        position: relative;
    }

    .img-card:hover img{
        transform: scale(1.05);
    }

    .info{
        display: flex;
        flex-direction: column;
        padding: 1.5em;
    }

    .price{
        position: absolute;
        top: 10px;
        right: 10px;
        font-weight: 500;
    }

    .rating{
        font-weight: 500;
    }
</style>

<body>
    <div class="carousel">
        <article class="img-card">
            <figure>
                <img src="/public/assets/images/abstract.jpg" alt="">
            </figure>
            <div class="info">
                <h1>Special Pizza</h1>
                <span class="rating">4.5&star;</span>
            </div>
            <span class="price">$20</span>
        </article>

        <article class="img-card">
            <figure>
                <img src="/public/assets/images/cafe_items (1).jpg" alt="">
            </figure>
            <div class="info">
                <h1>Straw Cake</h1>
                <span class="rating">4.5&star;</span>
                <span class="price">$20</span>
            </div>
        </article>

        <article class="img-card">
            <figure>
                <img src="/public/assets/images/cafe_items (2).jpg" alt="">
            </figure>
            <div class="info">
                <h1>Vanilla Cake</h1>
                <span class="rating">4.5&star;</span>
                <span class="price">$20</span>
            </div>
        </article>

        <article class="img-card">
            <figure>
                <img src="/public/assets/images/cafe_items (3).jpg" alt="">
            </figure>
            <div class="info">
                <h1>Meatball</h1>
                <span class="rating">4.5&star;</span>
                <span class="price">$20</span>
            </div>
        </article>

        <article class="img-card">
            <figure>
                <img src="/public/assets/images/cafe_items (4).jpg" alt="">
            </figure>
            <div class="info">
                <h1>Burger</h1>
                <span class="rating">4.5&star;</span>
                <span class="price">$20</span>
            </div>
        </article>
    </div>
</body>

</html>
