<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Component</title>
</head>

<body>
    <section class="carousel-component">

        <div class="carousel">
            <article class="carousel-item">                <figure class="item-display">
                    <img class="item-img" src="../../Assets/Images/pizza-slices.webp" alt="" decoding="async"
                        loading="lazy">
                </figure>
                <div class="item-info">
                    <h1>Special Pizza</h1>
                    <span class="item-rating">4.5&star;</span>
                </div>
                <span class="item-price">$20</span>
            </article>

            <article class="carousel-item">
                <figure class="item-display">
                    <img class="item-img" src="../../Assets/Images/strawberry-cake.webp" alt="" decoding="async"
                        loading="lazy">
                </figure>
                <div class="item-info">
                    <h1>Straw Cake</h1>
                    <span class="item-rating">4.5&star;</span>
                </div>
                <span class="item-price">$20</span>
            </article>

            <article class="carousel-item active">
                <figure class="item-display">
                    <img class="item-img" src="../../Assets/Images/healthy-toast.webp" alt="" decoding="async"
                        loading="lazy" height="100px" width="100px">
                </figure>
                <div class="item-info">
                    <h1>Vanilla Cake</h1>
                    <span class="item-rating">4.5&star;</span>
                </div>
                <span class="item-price">$20</span>
            </article>

            <article class="carousel-item">
                <figure class="item-display">
                    <img class="item-img" src="../../Assets/Images/pastry-rolls.webp" alt="" decoding="async"
                        loading="lazy">
                </figure>
                <div class="item-info">
                    <h1>Meatball</h1>
                    <span class="item-rating">4.5&star;</span>
                </div>
                <span class="item-price">$20</span>
            </article>

            <article class="carousel-item">
                <figure class="item-display">
                    <img class="item-img" src="../../Assets/Images/pancakes.webp" alt="" decoding="async"
                        loading="lazy">
                </figure>
                <div class="item-info">
                    <h1>Pancakes</h1>
                    <span class="item-rating">4.5&star;</span>
                </div>
                <span class="item-price">$20</span>
            </article>
        </div>

        <menu class="controls">
            <button class="prevBtn" data-action="slideToPrev">&#10094;</button>
            <menu class="indicators">
                <button class="indicator" aria-label="Go to slide 1">
                    <span></span>
                </button>
                <button class="indicator" aria-label="Go to slide 2">
                    <span></span>
                </button>
                <button class="indicator" aria-label="Go to slide 3">
                    <span></span>
                </button>
                <button class="indicator" aria-label="Go to slide 4">
                    <span></span>
                </button>
                <button class="indicator" aria-label="Go to slide 5">
                    <span></span>
                </button>
            </menu>
            <button class="nextBtn" data-action="slideToNext">&#10095;</button>
        </menu>

    </section>
</body>

<script src="./carousel.js" type="module" defer></script>
</html>
