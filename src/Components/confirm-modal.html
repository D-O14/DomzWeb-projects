<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Modal Component</title>
</head>

<style>
*,
*::before,
*::after{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui;
}

:root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
}
button{
    padding: .5em 1em;
    font-size: 1rem;
    font-weight: 600;
    border: 1px solid transparent;
    border-radius: .5em;
}

dialog{
    margin: 0 100px;
    box-shadow: var(--shadow);
    border: none;
    border-radius: .5em;
    max-width: 100%;
}

.dialog{
    display: flex;
    flex-direction: column;
    gap: 1em;
    width: 100%;
    padding: 1em 2em;
}

p{
    max-width: 60ch;
}

menu{
    background: hsla(200, 200%,97%);
    padding: 1em 2em;
    width: 100%;
}

.cancel{
    background: none;
    color: hsla(200, 200%, 7%);
}
</style>

<body>
    <button id="delBtn">Delete account</button>
    <dialog open="true">
        <div class="dialog">
            <h1>Deactivate Account?</h1>
            <p>Are you sure you want to deactivate your account? By doing this you will
                lose all of your saved data and will not be able to retrieve it.
            </p>
            <menu>
                <button id="cancelBtn" class="cancel">Cancel</button>
                <button id="dismissBtn" class="deactivate">Deactivate</button>
            </menu>
        </div>
    </dialog>
</body>

<script>
    const delBtn = document.getElementById("delBtn");
    const dialog = document.querySelector("dialog");
    const cancelBtn = document.getElementById("cancelBtn");
    const dismissBtn = document.getElementById("dismissBtn");

    delBtn.addEventListener("click", () => {
        dialog.showModal();
    });

    cancelBtn.onclick = () => {
        dialog.close();
    }

    dismissBtn.addEventListener("click",() => {
        dialog.close();
    })
</script>

</html>
