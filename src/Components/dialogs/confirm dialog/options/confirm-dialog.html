<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State-based confirmation dialog</title>
</head>

<body>
    <dialog open>
        <div class="dialog">
            <div class="content">
                <span class="icon" data-icon="exclaimFilled"></span>
                <h1 class="heading">Delete these files?</h1>
                <p>The selected files will be permanently deleted from your device and cannot be recovered.</p>
            </div>
            <menu>
                <label>
                    <input type="checkbox">
                    Don't show this again
                </label>
                <button class="dismissBtn border-gray-400">Cancel</button>
                <button class="dangerBtn text-white bg-red-600 hover:bg-red-800">Delete</button>
            </menu>
        </div>
    </dialog>
</body>

<script type="module" src="./confirm-dialog.js" defer></script>

</html>
