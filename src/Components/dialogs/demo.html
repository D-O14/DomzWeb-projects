<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Styles/tailwindcss/output.css">
    <title>Confirm dialog demo</title>
</head>
<style>
    @import "@styles/base/base.css";
    @import "@styles/base/variables.css";
    @import "@assets/designs/animations/animations.css";

    *::before,
    *::after,
    * {
        margin: 0px;
        padding: 0px;
        user-select: none;
        box-sizing: border-box;
        transition: all .3s ease allow-discrete;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    :root {
        --box-shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        --svg-shadow: 0px 0px 20px hsl(0, 90%, 55%);

        --bg-danger: hsl(0, 90%, 45%);
        --bg-icon: hsla(0, 90%, 90%, .65);

        --btn-hover: hsla(0, 0%, 90%, .5);

        --clr-primary: hsl(0, 0%, 0%);

        --brdr-danger: 1px solid hsl(0, 90%, 55%);
    }

    body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    dialog {
        padding: 2em;
        margin: 100px auto;
        border-radius: .75em;
        box-shadow: var(--box-shadow);
    }

    menu {
        gap: 1em;
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }

    h1 {
        font-weight: 500;
    }

    p {
        width: 50ch;
        margin-top: 10px;
        color: var(--muted);
    }

    svg {
        margin-bottom: 20px;
        border-radius: 5rem;
        fill: var(--bg-danger);
        border: var(--brdr-danger);
        box-shadow: var(--svg-shadow);
    }

    ::backdrop {
        background: var(--backdrop);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
    }

    .dialog {
        gap: 1.5em;
        display: flex;
        align-items: start;
        justify-content: start;
        flex-direction: column;
    }

    .dismissBtn:hover {
        background: var(--btn-hover);
    }
</style>

<body>
    <dialog open>
        <div class="dialog">
            <div class="content">
                <span class="icon" data-icon="exclaimFilled"></span>
                <h1 class="heading">Delete these files?</h1>
                <p class="message">The selected files will be permanently deleted from your device and cannot be
                    recovered.
                </p>
            </div>
            <menu>
                <label>
                    <input type="checkbox">
                    Don't show this again
                </label>
                <button class="dismissBtn border-gray-400">Cancel</button>
                <button class="confirmBtn text-white bg-red-600 hover:bg-red-800">Delete</button>
            </menu>
        </div>
    </dialog>
</body>

<script type="module" defer>
    import { icons, initializeIcons } from "@assets/Icons/icons.js";
    initializeIcons(document);

</script>

</html>
