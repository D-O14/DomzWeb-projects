<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Component</title>
</head>

<style>
    *::before,
    *::after,
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    button {
        width: 100%;
        font-weight: 600;
        cursor: pointer;
        padding: .5em 1em;
        border: 1px solid transparent;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: .5em;
        width: 100%;
        max-width: 350px;
        box-shadow: var(--shadow);
        border-radius: .5rem;
        overflow: hidden;
        margin: 100px auto;
    }

    input[type="text"] {
        width: 100%;
        height: 40px;
        padding: 1em 2em;
        border-radius: .25em;
        border: none;
        background: hsl(210, 40%, 95%);
    }

    input[type="radio"]{
        accent-color: hsl(0, 0%, 20%);
    }

    .form{
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(1fr, 100%);
        justify-content: center;
        margin-bottom: 1em;
    }

    .form-fields{
        display: grid;
        gap: 1em;
        grid-template-columns: repeat(2, 150px);
    }

    .actions{
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 1em;
        margin-top: 5px;
        margin-left: 10px;
        padding: .5em .75em;
    }

    .button{
        padding: 1em 2em;
        background: hsl(0, 0%, 10%);
        color: hsl(0, 0%, 100%);
    }
</style>

<body>
    <form>
        <div class="actions">
            <label>
                <input type="radio" name="radio">
                Round Trip
            </label>

            <label>
                <input type="radio" name="radio">
                One Way
            </label>
        </div>
        
        <div class="form">
            <input type="text" placeholder="Leaving From...">
            <input type="text" placeholder="Going to...">
            <div class="form-fields">
                <input type="text" placeholder="Depart">
                <input type="text" placeholder="Return">
                <input type="text" placeholder="People">
                <input type="text" placeholder="Class">
            </div>
        </div>
        <button class="button">SEARCH FLIGHTS</button>
    </form>
</body>

</html>
