<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawer Component</title>
</head>
<style>
    
    :root {
        --sub-bg-4:
            radial-gradient(circle at 70% 50%,
                hsla(0, 0%, 0%, 0.05),
                transparent 40%),
            hsl(33, 48%, 88%);
        --bg-dark: hsl(17, 30%, 9%);
        --txt-white: hsl(0, 0%, 95%);
        --txt-color: hsl(30, 50%, 25%);
        --accent: hsl(60, 56%, 91%);
    }

    dialog {
        width: 45%;
        position: relative;
        margin: auto;
        padding: 3rem;
        border: none;
        border-radius: 8px;
        opacity: 0;
        background: var(--sub-bg-4);
        box-shadow: 0 0 3px hsla(0, 0%, 0%, .5);
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;


        &::before {
            content: "";
            position: absolute;
            top: -155px;
            left: -150px;
            width: 300px;
            height: 250px;
            border-radius: 50%;
            background: var(--bg-dark);
            z-index: -1;
            pointer-events: none;
        }
    }

    dialog[open] {
        animation: slideIn .5s ease-out forwards;
    }

    /*dialog.closing {
        animation: slideOut .5s ease-out forwards;
    }*/

    @keyframes slideIn {
        from {
            transform: translateY(-100vh);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    dialog[open]::backdrop {
        background: hsla(0, 0%, 0%, .8);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
    }

    .formBtn {
        background: var(--bg-dark);
        border: none;
        color: hsl(60, 56%, 91%);
        border-radius: 6px;
        width: 100px;
        padding: .75em 1em;
        font-family: inherit;
        cursor: pointer;
        transition: .3s ease;


        &:hover {
            background: var(--bg-dark);
            transform: translateX(10px);
        }
    }


    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .form-title {
        display: flex;
        align-items: center;
        justify-content: center;

        & h2 {
            font-weight: 700;
            font-size: 2rem;
            color: var(--bg-dark);
            margin-bottom: 1rem;
        }
    }

    .close {
        background: none;
        border: none;
        font-size: 2rem;
        position: absolute;
        top: 10px;
        left: 650px;
    }

    .icon {
        position: absolute;
        left: 14px;
        opacity: .6;
    }

    .label {
        position: relative;
        font-size: 16px;
        padding-top: 1.25rem;
        margin-bottom: 5px;

        & .placeholder {
            position: absolute;
            left: 12px;
            top: 50%;
            top: calc(50% + 10px);
            transform: translateY(-50%);
            color: hsl(0, 0%, 67%);
            transition: all .3s ease-in-out;
            pointer-events: none;
        }
    }

    .label input {
        position: relative;
        outline: none;
        padding-left: 40px;
        background: hsla(0, 0%, 0%, 0.03);
        border: 1px solid var(--bg-dark);
        border-radius: 6px;
        padding: .75rem 1rem;
        caret-color: var(--accent);
        transition: transform .3s ease;

        &:focus {
            background: var(--bg-dark);
            color: var(--accent);
            outline: 3px solid hsl(43, 97%, 87%);
            outline-offset: 4px;
            box-shadow: 0 0 0 3px hsla(43, 57%, 77%, 0.4);
        }

        &:not(:focus) {
            background: var(--sub-bg-4);
        }

        &:focus-within {
            box-shadow: 0 0 0 3px var(--accent);
        }

    }
    
    .label input:valid+.placeholder,
    .label input:not(:placeholder-shown)+.placeholder,
    .label input:focus+.placeholder,
    .label input:-webkit-autofill+.placeholder {
        top: 20px;
        border-color: var(--accent);
        background: var(--accent);
        border-radius: 6px;
        padding: .25em;
        box-shadow: 0 0 3px hsl(0, 0%, 5%);
        color: var(--bg-dark);
    }
    
    .label input:-webkit-autofill,
    .label input:-webkit-autofill:hover,
    .label input:-webkit-autofill:focus,
    .label input:-webkit-autofill:active {
        -webkit-text-fill-color: var(--accent);
        -webkit-box-shadow: 0 0 0 1000px var(--sub-bg-4) inset !important;
        box-shadow: 0 0 0 1000px var(--sub-bg-4) inset !important;
        caret-color: var(--accent);
        transition: background-color 5000s ease-in-out 0s;
    }

    .label input:valid,
    .label input:focus {
        transition-delay: .3s;
    }

    .label input:not(:focus)+.placeholder,
    .label input:-webkit-autofill+.placeholder {
        background: var(--sub-bg-4);
        box-shadow: none;
    }

    .checks {
        display: flex;
        flex-direction: column;
        cursor: pointer;
        gap: .5rem;
        margin: 10px 0;

        & input {
            position: absolute;
            opacity: 0;
        }
    }

    #news-label,
    #terms-label {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .check {
        width: 15px;
        height: 15px;
        border: 2px solid hsl(0, 0%, 27%);
        border-radius: 4px;
        display: grid;
        background: hsl(0, 0%, 95%);
        place-items: center;
        position: relative;
        transition: .2s;
        cursor: pointer;
        vertical-align: middle;
        margin-right: .25rem;

        & svg {
            width: 10px;
            height: 10px;
            stroke: hsl(0, 0%, 100%);
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transform: scale(.5);
            transition: .2s;

            & path {
                stroke-dasharray: 24;
                stroke-dashoffset: 24;
            }
        }
    }

    .checks input:checked+.check svg {
        opacity: 1;
        transform: scale(1);
    }

    .checks input:checked+.check svg path {
        stroke-dashoffset: 0;
        transition: stroke-dashoffset .3s ease;
    }

    .checks input:checked+.check {
        border-color: hsl(0, 0%, 5%);
        background: var(--bg-dark);
    }

    .checks input:focus-visible+.check {
        outline: 2px solid blue;
        outline-offset: 2px;
    }

    label:not(#news-label, #terms-label) {
        font-size: 1.05rem;
        display: flex;
        flex-direction: column;
        gap: .5rem;
        color: var(--bg-dark);
    }

    .copyright {
        margin-top: 2rem;
        text-align: center;
        font-size: .9rem;
        color: var(--bg-dark);
    }

    a {
        text-decoration: none;
        color: hsl(210, 87%, 50%);
    }

    @media (max-width: 900px) {
        dialog {
            width: 60%;
            padding: 3.25rem;

            &::before {
                content: "";
                position: absolute;
                top: -175px;
                left: -125px;
                width: 250px;
                height: 250px;
                border-radius: 50%;
                background: var(--bg-dark);
                z-index: -1;
                pointer-events: none;
            }
        }

        .close {
            left: 380px;
        }
    }
</style>
<body>
    <button id="open-drawer" onclick="drawer.showModal()">Open Drawer</button>
    <dialog id="drawer" aria-labelledby="drawer-title">
    
        <div class="form-title">
            <h2 id="drawer-title">Become A Member Now!</h2>
        </div>
    
        <button value="cancel" aria-label="close" onclick="drawer.close()" type="button" class="close">
            &times;
        </button>
    
        <form action="" method="get" id="form" name="SignUpForm" spellcheck="true">
    
            <label for="name_input" class="name-label label">
                <input type="text" aria-labelledby="name-label" name="name" placeholder=" " inputmode="text"
                    autocapitalize="words" enterkeyhint="next" autocomplete="name" required autocorrect="on" id="name_input"
                    pattern="[A-Za-z\s]+" title="Name should only contain letters and spaces." autofocus>
    
                <span class="placeholder">Name:</span>
            </label>
    
            <label class="tel-label label" for="tel_input">
                <input aria-labelledby="tel-label" placeholder=" " type="tel" name="number" autocomplete="tel"
                    enterkeyhint="next" inputmode="numeric" pattern="0[789][01][0-9]{8}" id="tel_input" required
                    title="Must use valid phone number format, e.g. 091-6456-9891.">
                <span class="placeholder">Phone No:</span>
            </label>
    
            <label class="email-label label" for="email_inp">
                <input aria-labelledby="email-label" placeholder=" " type="email" name="email" autocomplete="email"
                    enterkeyhint="next" inputmode="email" required id="email_inp"
                    title="Use proper E-mail, quit being a grandma">
                <span class="placeholder">Email:</span>
            </label>
    
            <label class="pass-label label" for="pass_input">
                <input aria-labelledby="pass-label" placeholder=" " type="password" name="pass" id="pass_input"
                    autocomplete="current-password" enterkeyhint="done" inputmode="numeric" required minlength="8"
                    maxlength="12" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Password must be 8-12 characters long and include at least one uppercase letter, one lowercase letter, special character and one number.">
                <span class="placeholder">Password:</span>
            </label>
    
            <div class="checks">
                <label id="news-label" for="news-check">
                    <input type="checkbox" name="newsletter" aria-labelledby="news-label" id="news-check">
                    <span class="check">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" class="lucide lucide-check-icon lucide-check">
                            <path d="M20 6 9 17l-5-5" />
                        </svg>
                    </span>
                    Subscribe to our <a href="#" class="news-link">Newsletter</a>
                </label>
                <label id="terms-label" for="terms-check">
                    <input type="checkbox" name="terms" aria-labelledby="terms-label" checked required id="terms-check">
                    <span class="check">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" class="lucide lucide-check-icon lucide-check">
                            <path d="M20 6 9 17l-5-5" />
                        </svg>
                    </span>
                    I agree to the <a href="#" class="terms-link">Terms and Conditions</a>
                </label>
            </div>
    
            <menu>
                <button value="Submit" type="submit" onclick="form.requestSubmit()" class="formBtn">Submit</button>
            </menu>
    
        </form>
        <p class="copyright">
            &copy; 2024 <a href="#" class="copyright-link">Domz Cafe.</a> All rights reserved.
        </p>
    </dialog>
</body>
</html>
