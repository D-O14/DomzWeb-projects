<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress form component</title>
    <link rel="preload" as="style" onload="this.rel='stylesheet'" href="progress-form.css">
</head>

<body>
    <div class="progress-form">

        <div class="stepper-container">
            <div class="heading">
                <h3>Sign Up Form</h3>
            </div>
            <ul class="stepper">
                <li class="active">
                    <span class="icon" data-icon="user"></span>
                    About Yourself
                </li>
                <li>
                    <span class="icon" data-icon="education"></span>
                    Education
                </li>
                <li>
                    <span class="icon" data-icon="business"></span>
                    Work Experience
                </li>
                <li>
                    <span class="icon" data-icon="camera"></span>
                    Profile Picture
                </li>
            </ul>
        </div>

        <div class="forms">
            <template class="form-template">
                <form class="form active">
                    <div class="text">
                        <h2> <span class="icon" data-icon="user"></span> Your Personal Info</h2>
                        <p>Enter your personal details so we can get to know you.</p>
                    </div>
                    <label>
                        <span class="icon" data-icon="account"></span>
                        <input type="text" id="name" placeholder="Your name. Is it John?">
                        <p class="textError" aria-live="polite"></p>
                    </label>
                    <label>
                        <span class="icon" data-icon="mail"></span>
                        <input type="email" id="email" placeholder="Your Email. Don't make us guess">
                    </label>
                    <label>
                        <span class="icon" data-icon="phone"></span>
                        <input type="text" id="number" placeholder="Your Number. So we can contact you">
                    </label>
                    <label>
                        <span class="icon" data-icon="location"></span>
                        <input type="text" id="address" placeholder="Your Address. So we can find you">
                    </label>
                    <menu>
                        <button class="nxtBtn">Next</button>
                    </menu>
                </form>
            </template>

            <template class="form-template">
                <form class="form">
                    <div class="text">
                        <h2><span class="icon" data-icon="education"></span> Degree of Education</h2>
                        <p>Tell us about your education and degrees.</p>
                    </div>
                    <label>
                        <span class="icon" data-icon="school"></span>
                        <input type="text" placeholder="You went to college? Which?">
                    </label>
                    <label>
                        <span class="icon" data-icon="calendar"></span>
                        <input type="date">
                    </label>
                    <label>
                        <span class="icon" data-icon="study"></span>
                        <input type="text" placeholder="What'd you study?">
                    </label>
                    <label>
                        <span class="icon" data-icon="diploma"></span>
                        <input type="text" placeholder="You have a degree in?">
                    </label>
                    <menu>
                        <button class="backBtn">
                            <span></span>
                            Back
                        </button>
                        <button class="nxtBtn">Next</button>
                    </menu>
                </form>
            </template>

            <template class="form-template">
                <form class="form">
                    <div class="text">
                        <h2><span class="icon" data-icon="business"></span> Work Experience</h2>
                        <p>Tell us all about your experience in the working field.</p>
                    </div>
                    <label>
                        <span class="icon" data-icon="company"></span>
                        <input type="text" placeholder="What company have you worked for?">
                    </label>
                    <label>
                        <span class="icon" data-icon="hierarchy"></span>
                        <input type="email" placeholder="What role did you play?">
                    </label>
                    <label>
                        <span class="icon" data-icon="time"></span>
                        <input type="text" placeholder="How many years did you work with them?">
                    </label>
                    <textarea placeholder="What were your responsibilities?"></textarea>
                    <menu>
                        <button class="backBtn">
                            <span></span>
                            Back
                        </button>
                        <button class="nxtBtn">Next</button>
                    </menu>
                </form>
            </template>

            <template class="form-template">
                <form class="form">
                    <div class="text">
                        <h2><span class="icon" data-icon="camera"></span> Your Profile Picture</h2>
                        <p>Upload a picture of yourself so we can know you better.</p>
                    </div>
                    <div class="drop-box">
                        <span class="icon" data-icon="image"></span>
                        <h4>Choose an image. Any <button class="uploadBtn">Image</button>.</h4>
                        <p>PNG, JPEG, AVIF, WEBP, JPG</p>
                        <input type="file" hidden id="filePicker">
                    </div>
                    <menu>
                        <button class="backBtn">
                            <span></span>
                            Back
                        </button>
                        <button class="submitBtn">
                            Submit
                            <span class="icon" data-icon="check"></span>
                        </button>
                    </menu>
                </form>
            </template>

            <template class="form-completed">
                <img src="../../../Assets/Illustrations/Completed steps.gif" alt="">
            </template>
        </div>
    </div>
</body>
<script src="progress-form.js" type="module" defer></script>

</html>
