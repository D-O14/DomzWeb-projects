<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
</head>

<body>
    <main>
        <header>
            <nav>
                <a href="#" class="logo">
                    <span class="icon planet-icon" data-icon="loading"></span>
                    <span class="brandName">Artery</span>
                </a>
                <div class="nav" id="nav-menu">
                    <ul class="menu">
                        <li>
                            <a href="#" class="menu-item">
                                <span class="icon arrow-icon" data-icon="goArrow"></span>
                                <span class="anchor">Home</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="menu-item">
                                <span class="icon arrow-icon" data-icon="goArrow"></span>
                                <span class="anchor">About</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="menu-item">
                                <span class="icon arrow-icon" data-icon="goArrow"></span>
                                <span class="anchor">Projects</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="menu-item">
                                <span class="icon arrow-icon" data-icon="goArrow"></span>
                                <span class="anchor">Studio</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="menu-item">
                                <span class="icon arrow-icon" data-icon="goArrow"></span>
                                <span class="anchor">Catalogue</span>
                            </a>
                        </li>
                        <li class="dropdown">
                            <span class="icon arrow-icon" data-icon="goArrow"></span>
                            <div class="link">
                                <span class="menu-item">Contact</span>
                                <span class="icon arrow-icon" data-icon="arrowDown"></span>
                            </div>

                            <ul class="dropdown-menu">
                                <li>
                                    <a href="https://www.instagram.com/" target="_blank" class="dropdown-link">
                                        <span class="icon insta" data-icon="instagram"></span>
                                        <span class="social">Instagram</span></a>
                                </li>
                                <li>
                                    <a href="https://github.com/" target="_blank" class="dropdown-link">
                                        <span class="icon git" data-icon="gitHub"></span>
                                        <span class="social">GitHub</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="https://dribbble.com/" target="_blank" class="dropdown-link">
                                        <span class="icon dribbble" data-icon="dribbble"></span>
                                        <span class="social">Dribbble</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="tel:+234 09164569891" target="_blank" class="dropdown-link">
                                        <span class="icon phone" data-icon="phone"></span>
                                        <span class="social">Phone</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="mailto: dominionogwai613@gmail.com" class="dropdown-link">
                                        <span class="icon email" data-icon="email"></span>
                                        <span class="social">Email</span>
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>

                </div>

                <div class="nav-toggle" id="nav-toggle">
                    <span class="icon bar-icon" data-icon="menu"></span>
                    <span class="icon close-icon" data-icon="close"></span>
                </div>
            </nav>
        </header>
    </main>
</body>

<script src="./demo.js" type="module" defer></script>

</html>
