<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Component</title>
</head>

<body>
    <main class="app" id="app">
        <template class="nav-template">
            <header>
                <nav>
                    <a href="" class="logo">
                        <span class="icon planet-icon" data-icon=""></span>
                        <span class="brandName"></span>
                    </a>
                    <div class="nav" id="nav">
                        <ul class="menu">
                            <li class="dropdown">
                                <div class="link">
                                    <span class="nav-link"></span>
                                    <span class="icon" data-icon="arrowDown"></span>
                                </div>
                                <ul class="dropdown-menu">

                                </ul>
                            </li>
                        </ul>
                        <menu class="nav-menu">
                            
                        </menu>
                    </div>

                    <div class="nav-toggle" id="nav-toggle">
                        <span class="icon bar-icon" data-icon="menu"></span>
                        <span class="icon close-icon" data-icon="close"></span>
                    </div>
                </nav>
            </header>
        </template>

        <template class="link-template">
            <li>
                <a href="" class="link nav-link"></a>
            </li>
        </template>

        <template class="dropdown-template">
            <li>
                <a href="" class="dropdown-link">
                    <span class="sub-link"></span>
                    <span class="icon" data-icon=""></span>
                </a>
            </li>
        </template>

        <template class="btn-template">
            <button class="btn"></button>
        </template>
    </main>
</body>

<script src="./navbar.js" type="module" defer></script>

</html>
