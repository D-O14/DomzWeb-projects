<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *::before,
    *::after,
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    :root{
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    button {
        border: 2px solid transparent;
        border-radius: .25rem;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        cursor: pointer;
    }

    article {
        max-width: 100%;
        width: 450px;   
        height: auto;
        padding: 1em 1em 1em;
        box-shadow: var(--shadow);
        border-radius: 1rem;
    }

    figure {
        width: 100%;
    }

    img {
        width: 100%;
        height: auto;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: 1rem;
    }

    .category {
        color: hsl(0, 0%, 90%);
        background: hsl(220, 100%, 25%);
        padding: .25em 1em;
        border-radius: 1rem;
    }

    h1 {
        font-size: 1.25rem;
        font-weight: 700;
    }

    .card {
        padding: 2em 2em 2em;
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: 1rem;
    }

    .categories{
        border-radius: .5rem;
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: .5rem;
    }

    .price {
        color: hsl(0, 0%, 0%);
        font-weight: 600;
        font-size: 1.25rem;
    }

    .desc {
        color: hsl(0, 0%, 50%);
        text-align: start;
    }

    .cartBtn{
        width: 100%;
        color: hsl(0, 0%, 90%);
        background: hsl(220, 100%, 65%);
    }

    .cartBtn:hover{
        background: hsl(220, 80%, 60%);
        border-bottom: 5px inset hsl(220, 100%, 25%);
    }

    .stock{
        color: hsl(0, 0%, 40%);
    }

    menu{
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .add{
        background: none;
        border: 1px solid hsl(220, 24%, 25%);
        font-weight: 400;
        padding: .75em 1em;
    }
</style>
<body>
    <article>
        <figure>
            <img src="/public/assets/images/cafe_items (10).jpg" alt="">
        </figure>
        <div class="card">
            <!--<div class="categories">
                            <span class="category">Pastry</span>
                            <span class="category">Bread</span>
                            <span class="category">Rated</span>
                            <span class="category">Popular</span>
                            <span class="category">New</span>
                        </div>-->
            <h1>Bread roll - A bunch ( 35 pieces )</h1>
            <span class="price">$39.99</span>
    
            <p class="desc">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Eaque voluptate voluptas ipsum
                aspernatur aut molestiae hic beatae eius veritatis ut?
            </p>
            <button class="cartBtn">Add to Cart</button>
            <span class="stock">56+ pcs in stock</span>
            <menu>
                <button class="add">Add to cart</button>
                <button class="add">&hearts; Add to wishlist</button>
            </menu>
        </div>
    </article>
</body>
</html>
