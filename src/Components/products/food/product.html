<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Product Card Component</title>
    <link rel="stylesheet" href="./product.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Asimovian&family=DM+Serif+Text:ital@0;1&family=Electrolize&family=Paprika&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <article class="card">
            <div class="card-header">
                <img src="../../../Assets/Images/3d-coffee-cup.webp" alt="Decorative Image" class="img">
                <span class="category">Drink</span>
                <div class="options">
                    <button class="likeBtn" aria-label="Add to wishlist">
                        <span class="icon heart-icon" data-icon="heart"></span>
                    </button>
                </div>
            </div>

            <div class="card-content">
                <div class="tags">
                    <span class="tag">Popular</span>
                    <span class="tag">450kcal</span>
                    <span class="rating">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                            class="icon star">
                            <path
                                d="M11.9998 17L6.12197 20.5902L7.72007 13.8906L2.48926 9.40983L9.35479 8.85942L11.9998 2.5L14.6449 8.85942L21.5104 9.40983L16.2796 13.8906L17.8777 20.5902L11.9998 17Z">
                            </path>
                        </svg>
                        4.7
                    </span>
                </div>
                <div class="specs">
                    <h1 class="name">Coffee Cup</h1>
                    <span class="price">$16.6</span>
                </div>

                <p class="desc">
                    Creamy iced coffee with cocoa foam made from pure, fresh, imported cocoa beans.
                </p>

                <menu class="specs">
                    <button class="cartBtn" aria-label="Add To Cart Button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart preview-icon">
                            <path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18" />
                            <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25" />
                            <circle cx="18" cy="20" r="2" />
                            <circle cx="8" cy="20" r="2" />
                        </svg>
                        <span>Add To Cart</span>
                    </button>
                </menu>
            </div>
        </article>
    </main>
</body>

<script type="module">
    import { initializeIcons } from "@assets/Icons/icons";
    initializeIcons(document)
</script>

</html>
