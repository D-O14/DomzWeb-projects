<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Input Component</title>
    <link rel="preload" as="style" onload="this.rel='stylesheet'" href="searchInput.css">
</head>

<body>
    <nav>
        <template class="searchTemplate">
            <div class="search-bar">
                <span class="spinner"></span>
                <label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide search">
                        <path d="m21 21-4.34-4.34" />
                        <circle cx="11" cy="11" r="8" />
                    </svg>
                    <input type="search" class="search-input" placeholder="Have a look at anything" id="searchInput">
                </label>
            </div>
        </template>
    </nav>

    <main>
        <section class="cards-section">
            
            <div class="cards">
                <template class="noResults">
                    <div class="no-results">
                        <img src="search-illustr.svg" alt="">
                        <h2>Nothing found</h2>
                        <p>Try searching for something else</p>
                    </div>
                </template>
                
                <template class="cardTemplate">
                    <article class="card">
                        <figure>
                            <img src=" " alt="">
                        </figure>
                        <span class="cart">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide basket">
                                <path d="m15 11-1 9" />
                                <path d="m19 11-4-7" />
                                <path d="M2 11h20" />
                                <path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4" />
                                <path d="M4.5 15.5h15" />
                                <path d="m5 11 4-7" />
                                <path d="m9 11 1 9" />
                            </svg>
                        </span>
                        <div class="card-body">
                            <div class="info">
                                <h1></h1>
                                <span class="price"></span>
                            </div>
                            <p class="desc">
                                Crispy chicken cheese burger with island sauce, iceberg lettuce, tomato,
                                onions and pickles.
                            </p>
                            <button class="orderBtn">Order Now</button>
                        </div>
                    </article>
                </template>
            </div>

        </section>
    </main>


</body>

<script src="searchInput.js" defer></script>

</html>
