<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Component demo</title>
</head>

<style>
    *::before,
    *::after,
    * {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    :root {
        --bg-danger: hsl(358, 74%, 92%);

        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        --bxs: 2px 4px 6px hsl(0, 0%, 90%);

        --accent: hsl(210, 100%, 86%);

        --txt-clr: hsl(0, 0, 10%);
        --txt-danger: hsl(358, 74%, 49%);
        --txt-accent: hsl(210, 100%, 46%);

        --hover-btn: hsl(0, 0%, 95%);

        --border: 1px solid hsl(0, 0%, 80%);
    }

    ul {
        width: 100%;
        list-style: none;
    }

    ul:not(.sub-menu, :first-of-type) {
        border-top: var(--border);
    }

    button {
        font-size: 1rem;
        font-weight: 400;
        background: none;
        padding: .5em 1em;
        touch-action: manipulation;
        border: 1px solid transparent;
    }

    a,
    button,
    .sidebar-logo {
        flex-grow: 1;
        display: inline-flex;
        align-items: center;
        gap: .5em;
    }

    a,li:not(.sidebar-logo),button{
        cursor: pointer;
    }

    a {
        color: var(--txt-clr);
        text-decoration: none;
    }

    li:not(.dropdown, .sidebar-logo) {
        padding: .75em;
        transition: all .3s ease;
    }

    /*li:not(.active), button{
        color: hsl(0, 0%, 30%);
    }*/

    li:not(.dropdown, .sub-link, .sidebar-logo):hover {
        background: var(--accent);
        color: var(--txt-accent);
    }

    li[class="logout"] {
        transition: all .3s ease;
    }

    li[class="logout"]:hover {
        color: var(--txt-danger);
        background: var(--bg-danger);
    }

    li[class="logout"]:hover svg {
        stroke: var(--txt-danger);
    }

    .sidebar-logo{
        width: 100%;
        padding: 0;
        font-weight: 600;
        margin-bottom: .25em;
        justify-content: flex-end;
    }

    a,
    button,
    li {
        border-radius: .5em;
    }

    nav {
        width: 250px;
        min-height: 100dvh;
        padding: 5px 16px;
        position: sticky;
        top: 0;
        align-self: start;
        text-wrap: nowrap;
        border-radius: .5em;
        box-shadow: var(--bxs);
        border-right: var(--border);
    }

    svg {
        flex-shrink: 0;
        vertical-align: middle;
        transform: translate(0);
    }

    .active {
        background: var(--accent);
        color: var(--txt-accent);
    }

    .menu-btn {
        width: 100%;
        padding: .85em;
        transition: all .3s ease;
    }

    .menu-btn:hover {
        background: var(--hover-btn);
    }

    .sub-menu {
        height: 0;
        overflow: hidden;
        width: 100%;
        padding-left: 2em;
        transition: all .3s ease;
    }

    .logo{padding: .85em;}

    .icon,
    .lucide {
        width: 20px;
        height: 20px;
    }

    .toggle-btn {
        padding: 1em;
        margin-left: auto;
        border-radius: 5em;
    }

    /*.toggle-btn:hover{
        background: var(--hover-btn);
    }*/
</style>

<body>
    <nav class="sidebar">
        <ul>
            <li class="sidebar-logo">
                <span class="logo">DomzWeb</span>
                <button id="toggle-btn" class="toggle-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide panel">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M9 3v18" />
                    </svg>
                </button>
            </li>
            <li class="active">
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide dashboard">
                        <rect width="7" height="9" x="3" y="3" rx="1" />
                        <rect width="7" height="5" x="14" y="3" rx="1" />
                        <rect width="7" height="9" x="14" y="12" rx="1" />
                        <rect width="7" height="5" x="3" y="16" rx="1" />
                    </svg>
                    Dashboard
                </a>
            </li>
            <li><a href="">Orders</a></li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 21l18 0" />
                        <path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" />
                        <path d="M5 21l0 -10.15" />
                        <path d="M19 21l0 -10.15" />
                        <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" />
                    </svg>
                    Products
                </a>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide users">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <path d="M16 3.128a4 4 0 0 1 0 7.744" />
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                        <circle cx="9" cy="7" r="4" />
                    </svg>
                    Customers
                </a>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide package">
                        <path
                            d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
                        <path d="M12 22V12" />
                        <polyline points="3.29 7 12 12 20.71 7" />
                        <path d="m7.5 4.27 9 5.15" />
                    </svg>
                    Inventory
                </a>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide store">
                        <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" />
                        <path
                            d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244" />
                        <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" />
                    </svg>
                    Online Store
                </a>
            </li>
        </ul>

        <ul>
            <li class="dropdown">
                <button class="menu-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide dollar-sign">
                        <path
                            d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
                        <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
                        <path d="M12 18V6" />
                    </svg>
                    Finances
                </button>
                <ul class="sub-menu">
                    <li class="sub-link"><a href="">Invoices</a></li>
                    <li class="sub-link"><a href="">Transactions</a></li>
                    <li class="sub-link"><a href="">Reports</a></li>
                </ul>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide bar-chart">
                        <path d="M3 3v16a2 2 0 0 0 2 2h16" />
                        <path d="M7 16h8" />
                        <path d="M7 11h12" />
                        <path d="M7 6h3" />
                    </svg>
                    Analytics
                </a>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide percent">
                        <line x1="19" x2="5" y1="5" y2="19" />
                        <circle cx="6.5" cy="6.5" r="2.5" />
                        <circle cx="17.5" cy="17.5" r="2.5" />
                    </svg>
                    Discounts
                </a>
            </li>
        </ul>

        <ul>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide cog">
                        <path d="M11 10.27 7 3.34" />
                        <path d="m11 13.73-4 6.93" />
                        <path d="M12 22v-2" />
                        <path d="M12 2v2" />
                        <path d="M14 12h8" />
                        <path d="m17 20.66-1-1.73" />
                        <path d="m17 3.34-1 1.73" />
                        <path d="M2 12h2" />
                        <path d="m20.66 17-1.73-1" />
                        <path d="m20.66 7-1.73 1" />
                        <path d="m3.34 17 1.73-1" />
                        <path d="m3.34 7 1.73 1" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="12" cy="12" r="8" />
                    </svg>
                    Settings
                </a>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide question">
                        <path
                            d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                        <line x1="12" x2="12.01" y1="17" y2="17" />
                    </svg>
                    Help & Support
                </a>
            </li>
            <li>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide user">
                        <circle cx="12" cy="12" r="10" />
                        <circle cx="12" cy="10" r="3" />
                        <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662" />
                    </svg>
                    Accounts
                </a>
            </li>
            <li class="logout">
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide log-out">
                        <path d="m16 17 5-5-5-5" />
                        <path d="M21 12H9" />
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    </svg>
                    Logout
                </a>
            </li>
        </ul>
    </nav>
</body>

<script>
    const menuBtn = document.querySelector(".menu-btn");
    const dropdown = menuBtn.closest(".dropdown");
    const subMenu = dropdown.querySelector(".sub-menu");

    menuBtn.addEventListener("click", () => {
        subMenu.style.height = subMenu.scrollHeight + "px";
    })
</script>
</html>
