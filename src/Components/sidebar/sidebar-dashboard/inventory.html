<style>
    *::before,
    *::after,
    * {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    :root {
    --bg-page: hsl(250, 22%, 8%);
    --bg-danger: hsl(358, 74%, 12%);

    --shadow:
        0 4px 6px hsla(0, 0%, 0%, 5%),
        0 10px 20px hsla(0, 0%, 0%, 1%),
        0 20px 40px hsla(0, 0%, 0%, 15%);
    --bxs: 2px 4px 0px hsl(0, 0%, 5%);

    --accent: hsla(220, 100%, 16%, .5);

    --txt-clr: hsl(240, 20%, 92%);
    --txt-danger: hsl(358, 74%, 49%);
    --txt-accent: hsl(210, 100%, 46%);

    --hover-btn: var(--accent);
    --hover-clr: hsl(229, 20%, 12%);

    --border: 1px solid hsla(220, 25%, 25%, .5);
}

body {
    background: var(--bg-page);
    color: var(--txt-clr);
    display: grid;
    min-height: 100vh;
    transition: .3s ease;
    grid-template-columns: auto 1fr;
}

main{
    padding: 20px;
}
