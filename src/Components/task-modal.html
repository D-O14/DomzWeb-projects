<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Modal Component</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    body {
        background: hsl(0, 0%, 0%);
    }

    button {
        padding: .25em .5em;
        border: 1px solid transparent;
        border-radius: .25em;
        cursor: pointer;
    }

    input {
        padding: 1em 2em;
        border-radius: .25rem;
        width: 100%;
        height: 40px;
        background: hsl(0, 0%, 30%);
        border: 1px solid transparent;
        outline: none;
        caret-color: hsl(0, 0%, 100%);
        color: hsl(0, 0%, 100%);
    }

    dialog {
        margin: auto;
        box-shadow: var(--shadow);
        border: none;
        border-radius: .5em;
        transform: translateY(-100%);
        background: hsl(0, 0%, 25%);
        color: hsl(0, 0%, 100%);
    }

    dialog[open] {
        animation: slide .5s ease forwards;
    }

    @keyframes slide {
        from {
            transform: translateY(-100%);
        }

        to {
            transform: translateY(0);
        }
    }

    ::backdrop {
        background: hsla(0, 0%, 10%, .5);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
    }

    .dialog {
        display: flex;
        flex-direction: column;
        gap: 1em;
        width: 100%;
        padding: 1em 2em;
        border-radius: .5em;
    }

    .reminder {
        border-radius: 5rem;
        color: hsl(0, 0%, 100%);
        background: hsla(0, 0%, 35%);
    }

    .save {
        background: none;
        font-weight: 600;
        color: inherit;
    }

    label {
        font-weight: 500;
    }

    menu {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    :disabled {
        opacity: .5;
    }

    ::placeholder {
        color: hsl(0, 0%, 50%);
    }

    .add {
        padding: .25em .75em;
        font-size: 1rem;
        font-weight: 600;
    }
</style>

<body>
    <button class="add">Add task</button>
    <dialog>
        <div class="dialog">
            <label for="taskInput">New Task</label>
            <input type="text" placeholder="Add a task" id="taskInput">
            <menu>
                <button class="reminder">Add Reminder</button>
                <button class="save">Save</button>
            </menu>
        </div>
    </dialog>
</body>

<script>
    const addBtn = document.querySelector(".add");
    const saveBtn = document.querySelector(".save");
    const dialog = document.querySelector("dialog");
    const taskInput = document.getElementById("taskInput");

    addBtn.addEventListener("click", () => {
        dialog.showModal();
    });

    saveBtn.addEventListener("click", () => {
        dialog.close();
    });

    function validateTask() {
        if (taskInput.value.trim() === "") {
            saveBtn.setAttribute("disabled", "true");
        } else {
            saveBtn.removeAttribute("disabled");
        };
    }

    taskInput.addEventListener("input", () => { validateTask(); });
</script>

</html>
