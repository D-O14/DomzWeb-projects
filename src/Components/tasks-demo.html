<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Component</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    h1 {
        font-size: 1.25rem;
        margin-left: 15px;
    }

    menu {
        display: flex;
        align-items: center;
    }

    button {
        border: none;
        padding: .5em 1em;
        border-radius: .25em;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }

    nav {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1000px;
        padding: 2em;
        height: 60px;
        margin: 0 auto;
    }

    section {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    input {
        height: 40px;
        padding: 1em;
        border: none;
        outline: none;
        border-radius: .25em;
        caret-color: hsl(210, 100%, 50%);
        background: hsla(200, 100%, 96%);
        box-shadow: inset 1px 1px 2px hsl(0, 0%, 80%);
    }

    .tasks {
        border-radius: .5em;
        width: 100%;
        max-width: 50%;
        padding: 1em;
        margin: 0 auto;
    }

    .today,
    .tomorrow {
        border-radius: .5em;
        padding: 1em;
    }

    .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 1em;
        border-bottom: 1px solid hsl(0, 0%, 80%);
    }

    .label {
        display: flex;
        align-items: center;
        gap: 1em;
        width: 100%;
    }

    .time {
        color: hsl(210, 100%, 50%);
    }

    input[type="checkbox"] {
        position: relative;
        opacity: 0;
    }

    .checkbox {
        width: 1em;
        height: 1em;
        border: 1px solid hsl(0, 0%, 50%);
        border-radius: .25em;
        cursor: pointer;
        position: absolute;
    }

    .task:hover {
        transform: translateY(-3px);
    }

    @media screen and (max-width: 768px) {
        .tasks {
            max-width: 100%;
        }
    }

    .section-info {
        display: flex;
        align-items: center;
        gap: 1em;
    }

    .number {
        font-size: .95rem;
        opacity: .6;
    }

    .controls button {
        background: none;
    }

    .taskBtn {
        color: hsl(0, 0%, 100%);
        background: hsl(210, 80%, 50%);
    }
</style>

<body>
    <main>
        <nav>
            <h1>Inbox</h1>
            <menu class="controls">
                <button>&UpArrowDownArrow;</button>
                <button>&hellip;</button>
            </menu>
        </nav>
        <section>
            <div class="taskInput">
                <input type="text" id="taskInput" placeholder="Add Task">
                <button class="taskBtn">Add Task</button>
            </div>
            <div class="tasks">
                <div class="today">
                    <div class="section-info">
                        <h1>Today</h1>
                        <span class="number">4</span>
                    </div>

                    <template>
                        <div class="task">
                            <label class="label">
                                <input type="checkbox" class="check">
                                <span class="checkbox"></span>
                            </label>
                            <span class="time"></span>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>
</body>
<script>
    const tasksSection = document.querySelector(".today");
    const template = document.querySelector("template");
    const taskInput = document.getElementById("taskInput");
    const taskBtn = document.querySelector(".taskBtn");

    let suffix;
    let hours = new Date().getHours();
    let minutes = new Date().getMinutes();
    hours > 12 ? suffix = "PM" : suffix = "AM";
    const currentTime = `${ hours }:${ minutes }${ suffix }`;

    const tasks = [
        task = {
            title: taskInput.value,
            time: currentTime,
            id: crypto.randomUUID(),
        },
    ]

    function addTask(section, array) {
        section.innerHTML === "";
        array.forEach(arr => {
            const task = template.content.cloneNode(true);
            task.querySelector(".label").textContent = arr.title;
            task.querySelector(".time").textContent = arr.time;
            console.log(task);
            section.append(task);
        });
    };

    taskBtn.addEventListener("click", () => { addTask(tasksSection, tasks) });

</script>

</html>
