<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Component</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    h1 {
        font-size: 1.25rem;
        margin-left: 15px;
    }

    menu {
        display: flex;
        align-items: center;
    }

    button {
        border: none;
        padding: .5em 1em;
        border-radius: .25em;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }

    nav {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1000px;
        padding: 2em;
        height: 60px;
        margin: 0 auto;
    }

    section {
        display: flex;
        /*flex-direction: column;
        align-items: center;*/
        justify-content: center;
    }

    input[type="text"] {
        flex: 1;
        height: 40px;
        padding: 1em;
        border: none;
        outline: none;
        border-radius: .25em;
        caret-color: hsl(210, 100%, 50%);
        background: hsla(200, 100%, 96%);
        box-shadow: inset 1px 1px 2px hsl(0, 0%, 80%);
    }

    .app{
        width: 100%;
        max-width: 700px;
    }

    .tasks {
        border-radius: .5em;
        width: 100%;
        max-width: 50%;
        padding: 1em;
        margin: 0 auto;
    }

    .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 1em;
        border-bottom: 1px solid hsl(0, 0%, 80%);
    }

    .taskInput{
        display: flex;
        gap: 1em;
    }

    .label {
        display: flex;
        align-items: center;
        gap: 1em;
    }

    .task-date {
        color: hsl(210, 100%, 50%);
    }

    input[type="checkbox"] {
        position: absolute;
        cursor: pointer;
        opacity: 0;
    }

    .checkbox {
        width: 1em;
        height: 1em;
        border: 1px solid hsl(0, 0%, 50%);
        border-radius: .25em;
        cursor: pointer;
    }

    .task:hover {
        transform: translateY(-3px);
    }

    @media screen and (max-width: 768px) {
        .tasks {
            max-width: 100%;
        }
    }

    .controls button {
        background: none;
    }

    .taskBtn {
        color: hsl(0, 0%, 100%);
        background: hsl(210, 80%, 50%);
    }
</style>

<body>
    <nav>
        <h1>Inbox</h1>
        <menu class="controls">
            <button>&UpArrowDownArrow;</button>
            <button>&hellip;</button>
        </menu>
    </nav>
    <main>
        <section>
            <div class="app">
                <div class="taskInput">
                    <input type="text" id="taskInput" placeholder="Add Task">
                    <button class="taskBtn">Add Task</button>
                </div>

                <div class="tasks">
                    <template>
                        <div class="task">
                            <label class="label">
                                <input type="checkbox" class="check">
                                <span class="checkbox"></span>
                                <span class="task-title"></span>
                            </label>
                            <span class="task-date"></span>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>
</body>

<script>
    const tasks = [];
    const tasksSection = document.querySelector(".tasks");
    const template = document.querySelector("template");
    const taskInput = document.getElementById("taskInput");
    const taskBtn = document.querySelector(".taskBtn");

    taskBtn.addEventListener("click", () => {
        console.log(tasks);
        const task = {
            id: crypto.randomUUID(),
            taskName: taskInput.value.trim(),
            createdAt: getCurrentTime(),
            alarm: null,
            completed: false,
        };

        tasks.unshift(task);
        addTask(tasksSection, tasks);
        taskInput.value = "";
    });

    function getCurrentTime() {
        let hours = String(new Date().getHours()).padStart(2, "0");
        let minutes = String(new Date().getMinutes()).padStart(2, "0");
        let suffix = hours >= 12 ? "PM" : "AM";
        return `${ hours }:${ minutes }${ suffix }`;
    }

    function addTask(section, array) {
        section.innerHTML === "";
        array.forEach(arr => {
            const task = template.content.cloneNode(true);
            task.querySelector(".task-title").textContent = arr.taskName;
            task.querySelector(".task-date").textContent = arr.createdAt;
            task.querySelector(".check").id = arr.id;
            task.querySelector(".label").htmlFor = arr.id;
            section.append(task);
        });
    };

</script>

</html>
