<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials</title>
</head>
<style>
    .comment-img {
        position: absolute;
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        object-fit: cover;
        left: 10rem;
        top: -40px;
        max-width: 8rem;
        min-height: 8rem;
        border-radius: 50%;
        border: var(--border);
    }

    .comment-message {
        line-height: 1.5;
        text-align: center;
    }

    .testimonial {
        position: relative;
        max-width: 450px;
        width: 100%;
        height: auto;
        box-shadow: var(--shadow);
        padding: 1em 2em;
        border-radius: 1rem;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
    }

    .comment {
        padding: 3rem 1rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-direction: column-reverse;
        gap: 1rem;
    }

    .comment-info {
        display: flex;
        align-items: center;
        flex-direction: column;
    }

    .stars {
        border-radius: 1rem;
        padding: .25em .75em;
        gap: .5rem;
    }

    .icon {
        color: var(--rate-color);
    }

    .stars .icon:hover {
        transform: scale(1.3);
    }
</style>
<body>
    <article class="testimonial">
        <figure>
            <img class="comment-img" src="/public/assets/images/cafe_items (1).jpg" alt="testimonial image">
        </figure>
        <div class="comment">

                <h1>Someone famous</h1>
                <p>Director of something</p>
            </div>

                officiis quo? Expedita incidunt placeat voluptas ipsam illo doloremque ipsum, aut asperiores
                accusantium, impedit inventore temporibus eius."</blockquote>
