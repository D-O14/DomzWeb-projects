<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Styles/tailwindcss/output.css">
    <title>Toast Component demo</title>
</head>

<style>
    @import "@styles/base/base.css";
    @import "@styles/base/variables.css";
    @import "@assets/designs/animations/animations.css";

    *::before,
    *::after,
    * {
        margin: 0px;
        padding: 0px;
        user-select: none;
        box-sizing: border-box;
        transition: all .3s ease allow-discrete;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    
</style>

<body>
</body>
<script type="module" defer>
    import { icons, initializeIcons } from "@assets/Icons/icons.js";
    initializeIcons(document);

    const button = document.querySelector("button");
    const toast = document.querySelector(".toast");
    const close = document.querySelector(".close");
    const progress = document.querySelector(".progress");

    button.addEventListener("click", () => {
        toast.classList.add("visible");
        setTimeout(() => {
            toast.classList.add("hide");
        }, 5000);
        setTimeout(() => {
            toast.classList.remove("visible");
        }, 5300);

     });

    close.addEventListener("click", () => {
        toast.classList.add("hide");
    });
</script>

</html>
