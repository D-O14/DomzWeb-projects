<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Styles/tailwindcss/output.css">
    <title>Toast Component demo</title>
</head>

<style>
    @import "@styles/base/base.css";
    @import "@styles/base/variables.css";
    @import "@assets/designs/animations/animations.css";

    *::before,
    *::after,
    * {
        margin: 0px;
        padding: 0px;
        user-select: none;
        box-sizing: border-box;
        transition: all .3s ease allow-discrete;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    :root {
        --bg-success-icon: hsl(162, 78%, 17%);
        --bg-toast: linear-gradient(90deg, hsl(212, 95%, 15%) 0%, hsl(227, 17%, 16%) 40%);
        
        --clr-success-icon: hsl(161, 89%, 55%);
    }

    body{
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .toast {
        width: 450px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1em;
        border-radius: .5em;
        box-shadow: var(--shadow);
    }

    .icon:not(.close .icon) {
        width: 2em;
        height: 2em;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: .5em;
        background: var(--bg-success-icon);
    }

    .icon:not(.close .icon) svg {
        stroke: var(--clr-success-icon);
    }
</style>

<body>
    <div class="toast">
        <span class="icon" data-icon="check"></span>
        <div class="content">
            <strong>Success</strong>
            <p>Toast notification created successfully!</p>
        </div>
        <button class="close" aria-label="close">
            <span class="icon" data-icon="close"></span>
        </button>
    </div>
</body>
<script type="module" defer>
    import { icons, initializeIcons } from "@assets/Icons/icons.js";
    initializeIcons(document);

</script>

</html>
