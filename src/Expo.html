<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        transition: all .5s ease;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    body {
        /*height: 60dvh;
        display: flex;
        align-items: center;
        justify-content: center;*/
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background: hsla(210, 80%, 90%, .5);
    }

    h1 {
        font-weight: 400;
        font-size: 16px;
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
    }

    .icon {
        margin: 100px auto;
    }

    .lock,
    .info {
        margin: 100px auto;
    }

    .shackle {
        transform-box: view-box;
        transform-origin: bottom left;
        transition: transform 300ms ease;
    }

    .lock:hover .shackle {
        transform: rotate(-15deg);
    }

    .refresh:hover {
        transform: rotate(1turn);
        transition: transform 2s ease-in-out;
    }

    .close:hover {
        transform: rotate(1turn);
        transition: transform 1000ms ease-in-out;
    }

    .info:hover {
        transform: translateY(-10px);
    }

    .check-path {
        stroke-width: 2;
        animation: draw-check 600ms ease forwards;
    }

    /*.icon{
        padding: 10px;
        border-radius: 5rem;
        background: hsl(210, 100%, 52%);
    }*/

    .dashboard:hover .rect-1 {
        height: 5px;
    }

    .dashboard:hover .rect-2 {
        width: 15px;
    }

    .dashboard:hover .rect-3 {
        width: 20px;
        height: 20px;
    }

    .dashboard:hover .rect-4 {
        height: 10px;
        transform-box: fill-box;
        transform-origin: top;
        transform: scale(1.05);
    }

    @keyframes draw {
        to {
            stroke-dashoffset: 0;
        }
    }

    .trash:hover .trash-lid {
        transform-origin: bottom left;
        transform: translateY(-2px) rotate(-20deg);
    }

    path {
        animation: draw 600ms ease forwards;
    }
</style>
