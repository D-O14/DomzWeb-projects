<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css/normalize.css" />
    <!--<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
    <title>Domz Cafe - Expo</title>
</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease-in-out;
    }

    .hero{
        position: relative;
        height: 100vh;
        overflow: hidden;
    }

    .slides{
        position: relative;
        height: 100%;
    }

    img{
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        animation: fade 12s infinite;
    }

    .slides img:nth-child(1){
        animation-delay: 0s;
    }

    .slides img:nth-child(2){
        animation-delay: 4s;
    }

    .slides img:nth-child(3){
        animation-delay: 8s;
    }

    .slides img:nth-child(4){
        animation-delay: 12s;
    }

    .slides img:nth-child(5){
        animation-delay: 16s;
    }

    @keyframes fade{
        0% { opacity: 0; }
        10% { opacity: 1; }
        30% { opacity: 1; }
        40% { opacity: 0; }
        100% { opacity: 0; }
    }

</style>

<body>
    <main>
        <section class="hero">
                <div class="slides">
                    <img src="Hotel_items (1).jpg" alt="" id="slide-1">
                    <img src="Hotel_items (2).jpg" alt="" id="slide-2">
                    <img src="cafe_items (2).jpg" alt="" id="slide-3">
                    <img src="Hotel_items (3).jpg" alt="" id="slide-4">
                    <img src="cafe_items (12).jpg" alt="" id="slide-5">
                </div>
        </section>
    </main>

</body>

</html>
