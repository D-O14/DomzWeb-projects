<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css/normalize.css" />
    <!--<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
    <title>Domz Cafe - Expo</title>

<style>

    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease-in-out;
    }

    .categories {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 1.5rem;
    }

    div {
        width: 25%;
        flex-grow: 1;
        height: auto;
    }

    img {
        border-radius: .25em;
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        display: block;
        object-fit: cover;
        position: relative;
    }

    img:hover {
        transform: scale(.95);
    }

    .img-overlay {
        border-bottom-right-radius: 8px;
        border-bottom-left-radius: 8px;
        position: absolute;
        bottom: 0;
        top: 0;
        left: 0;
        right: 100px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.7);
        font-weight: bold;
        color: #fff;
    }
</style>
