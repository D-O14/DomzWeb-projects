<style>
    :root {
        --dark: hsl(210, 100%, 45%, .65);

        --primary: hsl(0, 80%, 25%);
        --primary-3: hsl(240, 80%, 50%);
        --secondary-1: hsl(300, 60%, 25%);
        --secondary-2: hsl(120, 60%, 25%);
        --secondary-3: hsl(39, 80%, 25%);
        --tertiary-1: hsl(300, 80%, 25%);
        --tertiary-2: hsl(300, 50%, 25%);
        --tertiary-3: hsl(180, 50%, 25%);
        --tertiary-4: hsl(120, 50%, 25%);
        --tertiary-5: hsl(5, 77%, 55%);
        --tertiary-6: hsl(45, 100%, 50%);
        --base-clr: var(--shade-8);
        --brand-clr: var(--tertiary-6);

        /* 
        ----------------
            Analogous
        ----------------
        */

        --shade-1: blue;
        --shade-2: teal;
        --shade-3: green;
        --shade-4: chartreuse;

        --shade-5: violet;
        --shade-6: purple;
        --shade-7: magenta;

        --shade-8: yellow;
        --shade-9: red;
        --shade-10: orange;
        --shade-11: hsl(5, 77%, 55%);
        --shade-12: hsl(45, 100%, 50%);

        /*
        --------------
        Complementary
        --------------
        */

        --complement-shade-1: red;
        --complement-shade-2: green;

        --complement-shade-3: blue;
        --complement-shade-4: orange;

        --complement-shade-5: violet;
        --complement-shade-6: hsl(45, 100%, 50%);

        --complement-shade-7: magenta;
        --complement-shade-8: chartreuse;

        --complement-shade-9: teal;
        --complement-shade-10: hsl(5, 77%, 55%);

        --complement-shade-11: purple;
        --complement-shade-12: yellow;

        /*--brand-shade-1: hsl(from var(--brand-clr) h s calc(l + 2) / .5);
        --brand-shade-2: hsl(from var(--brand-clr) h s calc(l + 4) / .5);
        --brand-shade-3: hsl(from var(--brand-clr) h s  calc(l + 6) / .5);
        --brand-shade-4: hsl(from var(--brand-clr) h s  calc(l + 8) / .5);
        --brand-shade-5: hsl(from var(--brand-clr) h s  calc(l + 10) / .5);
        --brand-shade-6: hsl(from var(--brand-clr) h s  calc(l + 12) / .5);*/
    }

    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    body {
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        /*background: var(--dark);
        background: hsl(from var(--brand-clr) h s l / .5);*/
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: inherit;
    }

    button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        cursor: pointer;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        position: relative;
        border-radius: .25rem;
        transform-origin: bottom;
        backdrop-filter: blur(5px);
        color: hsla(0, 0%, 100%);
        -webkit-backdrop-filter: blur(5px);
        /*background: hsla(250, 50%, 60%, 0.2);*/
        border: 1px solid transparent;
        box-shadow: -4px -2px 5px hsla(0, 0%, 0%, 0.1);
        /*border: 1px solid hsla(from var(--shade-1) h s calc(l + 2) / .5);*/
    }

    menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .box {
        padding: 2em;
        height: 200px;
        flex: 0 0 300px;
        border-radius: 4px;
        width: min(500px, 80%);
        color: hsl(3, 0%, 100%);
        font-size: clamp(12px, 2vw, 1rem);
        box-shadow:
            2px 2px 0px hsla(0, 0%, 0%, 0.1),
            -2px -2px 0px hsla(0, 0%, 0%, 0.1);
        background: linear-gradient(270deg, hsl(0, 100%, 50%), hsl(30, 100%, 50%), hsl(210, 100%, 50%), hsl(220, 100%, 45%), hsl(340, 100%, 58%));
        background-size: 300% 300%;
        transition: all .3s ease;
        animation: gradientShift 5s linear infinite;
    }

    @keyframes gradientShift {
        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background: 0% 50%;
        }
    }

    .boxes {
        gap: 1rem;
        display: flex;
    }

    /*.linear{
        background: repeating-linear-gradient(to top right, var(--shade-1) 0px 40px, var(--shade-2) 45px 70px);
        background: linear-gradient(to bottom right, hsl(0, 100%, 50%), hsla(0, 100%, 50%, .5));
    }

    .radial{
        background: repeating-radial-gradient(circle, var(--shade-9) 0%, 10%, var(--shade-10) 10% 20%);
    }

    .conic{
        width: 200px;
        background: conic-gradient(from 45deg at 40% 60%, hsl(0, 100%, 50%), hsl(39, 100%, 50%), hsl(215, 77%, 50%),
         hsl(30, 100%, 50%), hsl(5, 100%, 50%));
    }

    .box:nth-of-type(1){
        background: color-mix(in hsl, var(--complement-shade-9) 25%, var(--complement-shade-2) 70%);
    }

    .box:nth-of-type(2){
        background: color-mix(in lch increasing hue, var(--complement-shade-9) 15%, var(--complement-shade-2) 50%);
    }

    .box:nth-of-type(3){
        background: color-mix(in oklab, var(--complement-shade-9) 50%, hsl(0, 0%, 100%) 10%);
    }*/

    h1 {
        color: transparent;
        background: linear-gradient(90deg, hsl(0, 100%, 50%), hsl(5, 100%, 50%), hsl(210, 100%, 50%));

        background-clip: text;
        -webkit-background-clip: text;
    }
</style>
