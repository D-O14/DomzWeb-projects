<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--<link rel="stylesheet" href="/src/css/output.css">-->
    <title>Domz Cafe - Expo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Asimovian&family=DM+Serif+Text:ital@0;1&family=Electrolize&family=Paprika&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: all .5s ease;
        font-family: system-ui;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        interpolate-size: allow-keywords;
    }

    body{
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
    }

    .flexbox{
        display: flex;
        flex-wrap: wrap;
        width: 500px;
        height: 500px;
        border: 4px solid;
    }

    .box{
        flex: 1;
        padding: .5em 1em;
        background: hsl(340, 57%, 64%);
        width: 100px;
        height: 100px;
        border: 8px solid hsl(0, 80%, 50%);
        border-radius: .5rem;
    }

</style>

<body>
    <main>
        <div class="flexbox">
            <div class="box">box-1</div>
            <div class="box">box-2</div>
            <div class="box">box-3</div>
        </div>
    </main>
</body>

<script type="text/javascript" defer>
    
</script>

</html>
