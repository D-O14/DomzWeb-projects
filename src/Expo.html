<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domz Cafe - Expo</title>
</head>

<style>
    :root{
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        interpolate-size: allow-keywords;
        
    }

    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
    }

    section {
        height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card{
        max-width: 300px;
        width: 100%;
        height: 350px;
        box-shadow: var(--shadow);
        padding: .25rem;
        text-align: start;
        transition: transform .3s ease;
        position: relative;
        border-radius: 1.25rem;
    }

    .card:hover{
        transform: translateY(-10px);
    }

    img{
        width: 100%;
        border-radius: .5rem;
        height: auto;
        aspect-ratio: 16/9;
        display: block;
        object-fit: cover;
        transition: transform .3s ease;
    }

    .card-content{    
        position: absolute;
        bottom: -3px;
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: .5rem;
        padding: 1.25rem;
        transition: transform .3s ease;
        border-bottom-left-radius: 1.25rem;
        border-bottom-right-radius: 1.25rem;
    }

    .card-footer{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: hsl(0, 0%, 27%);
    }

    span{
        display: inline-flex;
        align-items: center;
        gap: .25rem;
        font-size: 1rem;
        transition: color .3s ease;
    }

    button{     
        display: inline-flex;
        align-items: center;
        border: none;
        gap: .5rem;
        padding: .5em 1em;
        border-radius: .5rem;
        font-weight: 500;       
        background: hsl(10, 0%, 5%);
        color: hsl(0, 0%, 90%);
        transition: background .3s ease;
    }

    p{
        line-height: 1lh;
        font-size: .95rem;
        margin-bottom: 1.25rem;
        color: hsl(0, 0%, 40%);
        transition: color .3s ease;
    }

    .lucide-badge-check{
        color: hsl(210, 80%, 50%);
        font-size: 30px;
        vertical-align: middle;
        margin-left: 5px;
    }

    .card:hover .card-content{
        background: linear-gradient(to top, hsla(217, 76%, 16%, 0.9), hsla(216, 86%, 59%, 0));
        transform: translateY(-3px);
        border-bottom-left-radius: 1.25rem;
        border-bottom-right-radius: 1.25rem;
    }

    .card:hover img{
        height: 340px;
    }

    .card:hover h2,
    .card:hover span,
    .card:hover p{
        color: hsl(0, 0%, 90%);
    }

    .card:hover button{
        color: hsl(0, 0%, 25%);
        background: hsl(0, 0%, 100%);
    }

    .card:hover .lucide-badge-check{
        fill: hsl(210, 80%, 50%);
        color: hsl(0, 0%, 90%);
    }

    h2{
        font-size: 1.05rem;
        font-weight: 600;
        color: hsl(0, 0%, 10%);
        transition: color .3s ease;
    }

</style>

<body>
    <main>
        <section>
            <article class="card">
                <figure class="card-img">
                    <img src="Hotel_items (1).jpg" alt="">
                </figure>
                <div class="card-content">
                    <h2>Julius Bennett<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-badge-check-icon lucide-badge-check">
                        <path
                            d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg></h2>
                    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Eum, nam?</p>
                <div class="card-footer">
                    <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-user-round-icon lucide-user-round">
                        <circle cx="12" cy="8" r="5" />
                        <path d="M20 21a8 8 0 0 0-16 0" />
                    </svg>351</span>

                    <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart">
                        <path
                            d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" />
                    </svg>15.2k</span>

                    <button>Follow <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-user-plus-icon lucide-user-plus">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <line x1="19" x2="19" y1="8" y2="14" />
                        <line x1="22" x2="16" y1="11" y2="11" />
                    </svg></button>
                </div>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
