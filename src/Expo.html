<style>
/* style 1*/
:root {
--font-body: "Inter", system-ui, -apple-system, sans-serif;
--font-heading: "Inter", system-ui, sans-serif;

--text-color: #111;
--text-muted: #555;

--line-height-body: 1.6;
--line-height-heading: 1.2;

--measure: 65ch;
}

/* Base */

body {
font-family: var(--font-body);
color: var(--text-color);
line-height: var(--line-height-body);
letter-spacing: 0.01em;

text-rendering: optimizeLegibility;
font-kerning: normal;

-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}

/* Headings */

h1, h2, h3, h4 {
font-family: var(--font-heading);
line-height: var(--line-height-heading);
text-wrap: balance;
letter-spacing: -0.02em;
margin-bottom: 0.5em;
}

/* Paragraphs */

p {
max-width: var(--measure);
text-wrap: pretty;
overflow-wrap: break-word;
margin-bottom: 1.2em;
}

/* Links */

a {
text-decoration: underline;
text-decoration-thickness: 1.5px;
text-underline-offset: 3px;
}

/* Lists */

ul, ol {
padding-left: 1.2rem;
}

/* Small text */

small {
color: var(--text-muted);
}

/* Utility */

.text-muted {
color: var(--text-muted);
}

.truncate {
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.line-clamp-2 {
display: -webkit-box;
line-clamp: 2;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

/* style 2 */

:root {

/* Font Families */
--font-body: "Inter", system-ui, sans-serif;
--font-heading: "Inter", system-ui, sans-serif;

/* Fluid Font Sizes */
--step--1: clamp(0.85rem, 0.8rem + 0.2vw, 0.95rem);
--step-0: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
--step-1: clamp(1.25rem, 1.1rem + 0.8vw, 1.5rem);
--step-2: clamp(1.5rem, 1.3rem + 1.2vw, 2rem);
--step-3: clamp(2rem, 1.6rem + 2vw, 2.75rem);
--step-4: clamp(2.5rem, 2rem + 3vw, 3.5rem);

/* Line Heights */
--lh-body: 1.6;
--lh-heading: 1.2;

/* Measure */
--measure: 65ch;
}

/* Base */

body {
font-family: var(--font-body);
font-size: var(--step-0);
line-height: var(--lh-body);

text-rendering: optimizeLegibility;
font-kerning: normal;
}

/* Headings */

h1 {
font-size: var(--step-4);
line-height: var(--lh-heading);
text-wrap: balance;
}

h2 {
font-size: var(--step-3);
line-height: var(--lh-heading);
text-wrap: balance;
}

h3 {
font-size: var(--step-2);
line-height: var(--lh-heading);
}

h4 {
font-size: var(--step-1);
}

/* Small text */

small {
font-size: var(--step--1);
}

/* Paragraph */

p {
max-width: var(--measure);
text-wrap: pretty;
margin-bottom: 1em;
}
