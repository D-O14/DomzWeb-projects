    .radio {
        display: flex;
        margin-left: 1rem;
        gap: 2rem;
    }

    input[type="radio"] {     
        transform: translateY(1px);
        cursor: pointer;
        transform: scale(1.5);
    }

    .radios{
        accent-color: hsl(24, 80%, 52%);
    }

    label {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
    }

    .inputs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
    }

    .formBtn:active {
        transform: scale(.95);
    }

    .form{
        display: none;
    }

    .form.active{
        display: block;
    }

        const buttons = document.querySelectorAll(".radios");
        const forms = document.querySelectorAll(".form")

        buttons.forEach(btn => {
            btn.addEventListener("click", () => {
                const type = btn.dataset.type;

                buttons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");

                forms.forEach(form => {
                    form.classList.remove("active");

                    if(form.id === type + "Form"){
                        form.classList.add("active");
                    }
                });
            });
        });


    </script>
