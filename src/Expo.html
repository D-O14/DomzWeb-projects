    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
    }

    [popover]{
        border: none;
        padding: 1rem 1.25rem;
        background: hsl(0, 0%, 13%);
        color: hsl(0, 0%, 100%);
        border-radius: 8px;
        min-width: 220px;
    }

    #toast{
        anchor-name: --toast;
        position: fixed;
        
        left: 100px;
    }

    #toast-second{
        position-anchor: --toast;
        top: anchor(bottom);
    }

</style>

<body>
    <main>
        <section>
            <!--<picture>
                <source

            <form novalidate>
                <label for="name">
                    Name:
                    <input type="text" name="name" required>
                </label>

                <label for="email">
                    Email:
                    <input type="email" name="email" required>
                </label>

                <button type="button" popovertarget="toast">Submit</button>
            </form>

            <div id="toast" popover>
                Form Submitted Successfully!
                <button popovertarget="toast" popovertargetaction="hide" aria-label="close">&times;</button>
            </div>

            <button popovertarget="toast-second">Toast</button>
            <div id="toast-second" popover>
                Another Toast stacked below!
                <button popovertarget="toast-second" aria-label="close" popovertargetaction="hide">&times;</button>
            </div>


        </section>
    </main>
