<style>
    :root {
        /*--base-clr: hsl(128, 50%, 26%);*/
        --base-clr: var(--brand-clr);
        --brand-clr: hsl(20, 50%, 45%);
        /*--brand-clr: hsl(213, 100%, 50%);*/
        --base-shade-1: hsl(from var(--base-clr) h s calc(l + 14));
        --base-shade-2: hsl(from var(--base-clr) h s calc(l + 20));

        /*--brand-shade-2: hsl(from var(--brand-clr) h s calc(l + 10));
        --brand-shade-3: hsl(from var(--brand-clr) h s calc(l + 15));
        --brand-shade-4: hsl(from var(--brand-clr) h s calc(l + 20));*/

        --brand-shade-1: hsl(from var(--brand-clr) h s calc(l + 8) / .75);
        --brand-shade-2: hsl(from var(--brand-clr) h s calc(l + 12) / .5);
        --brand-shade-3: hsl(from var(--brand-clr) h s calc(l + 16) /.5);
        --brand-shade-4: hsl(from var(--brand-clr) h s calc(l + 20) /.5);
        --brand-shade-5: hsl(from var(--brand-clr) h s calc(l + 24) / .25);
        --brand-shade-6: hsl(from var(--brand-clr) h s calc(l + 28) / .5);
    }

    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        transition: all .5s ease;
        -webkit-tap-highlight-color: transparent;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    /*html{
        background: url(./Assets/Images/abstract-waves.jpg);
    }*/

    body {
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        /*background: hsl(from var(--brand-clr) h s l / .5);*/
        background: var(--base-clr);
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: inherit;
    }

    button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        cursor: pointer;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        position: relative;
        border-radius: .25rem;
        transform-origin: bottom;
        backdrop-filter: blur(5px);
        color: hsla(0, 0%, 100%);
        -webkit-backdrop-filter: blur(5px);
        /*background: hsla(250, 50%, 60%, 0.2);*/
        box-shadow: -4px -2px 5px hsla(0, 0%, 0%, 0.1);
        border: 1px solid hsla(from var(--brand-clr) h s calc(l + 28) / .3);
    }

    menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .box {
        padding: 2em;
        height: 200px;
        flex: 0 0 300px;
        border-radius: 4px;
        /*width: min(500px, 80%);
        color: hsl(3, 0%, 100%);
        font-size: clamp(12px, 2vw, 1rem);
        box-shadow:
            2px 2px 0px hsla(0, 0%, 0%, 0.1),
            -2px -2px 0px hsla(0, 0%, 0%, 0.1);*/
        background: hsl(from var(--base-clr) h calc(s + 10) calc(l + 10));
    }

    .boxes {
        gap: 1rem;
        display: flex;
    }

    .btn-0 {
        background: var(--base-clr);
        box-shadow:
            2px 2px 0px hsla(0, 0%, 0%, 0.1),
            -2px -2px 0px hsla(0, 0%, 0%, 0.1);
    }

    .btn-1 {
        background: var(--brand-shade-1);
    }

    .btn-2 {
        background: var(--brand-shade-2);
    }

    .btn-3 {
        background: var(--brand-shade-3);
    }

    .btn-4 {
        background: var(--brand-shade-4);
    }

    .btn-5 {
        background: var(--brand-shade-5);
    }

    .btn-6 {
        background: var(--brand-shade-6);
    }
</style>
