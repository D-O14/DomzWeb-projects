<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        transition: all .5s ease;
        -webkit-tap-highlight-color: transparent;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    body {
        height: 60dvh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: inherit;
    }

    button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        cursor: pointer;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        position: relative;
        border-radius: .25rem;
        transform-origin: bottom;
        backdrop-filter: blur(5px);
        color: hsla(0, 0%, 100%);
        -webkit-backdrop-filter: blur(5px);
        background: hsla(250, 50%, 60%, 0.2);
        border: 2px solid hsla(250, 50%, 60%, 0.3);
        box-shadow: -4px -2px 5px hsla(0, 0%, 0%, 0.1);
    }

    menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .box{
        padding: 2em;
        font-size: clamp(12px, 2vw, 1rem);
        height: 200px;
        border-radius: 4px;
        width: min(500px, 80%);
        box-shadow: 
            2px 2px 0px hsla(0, 0%, 0%, 0.1),
            -2px -2px 0px hsla(0, 0%, 0%, 0.1);
    }
</style>

<body>
