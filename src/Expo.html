    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: all .3s ease;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        interpolate-size: allow-keywords;
        --dark: hsl(220, 24%, 12%);
        --dark-shade-1: hsl(220, 24%, 15%);
        --dark-shade-2: hsl(220, 20%, 18%);
        --light: hsl(0, 0%, 100%);
        --light-shade: hsl(220, 100%, 97%);
        --fw-base: 400;
        --fw-sb: 600;
        --rate-color: hsl(51, 100%, 50%);
        --border: 4px solid hsl(0, 0%, 90%);
    }

    html {
        scroll-behavior: smooth;
        font-size: 1rem;
    }

    figure {
        width: 100%;
    }

    img {
        width: 100%;
        height: auto;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
    }

    button {
        border: 2px solid transparent;
        border-radius: .25rem;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        cursor: pointer;
    }

    input:not(input[type="checkbox"], input[type="radio"]) {
        border: 1px solid hsl(0, 0%, 80%);
        border-radius: .25rem;
        padding: .5rem 1rem;
        width: 100%;
        height: 40px;
        outline: none;
    }

    input:not(input[type="checkbox"], input[type="radio"]):focus,
    input:not(input[type="checkbox"], input[type="radio"]):hover {
        scale: 1.02;
        outline: 1px solid hsl(220, 100%, 65%);
        outline-offset: 1px;
    }

    a {
        color: var(--light);
        text-decoration: none;
    }

    a,
    button {
        cursor: pointer;
    }

    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: var(--dark);
        box-shadow: var(--shadow);
        z-index: 1;
    }
