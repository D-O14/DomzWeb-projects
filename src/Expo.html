    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Verdana;
        text-align: center;
    }

    form {
        display: grid;
        grid-template-columns: repeat(1, auto);
        max-width: 100%;
        width: 450px;
        gap: 1rem;
    }

    button {
        border: 2px solid transparent;
        border-radius: .25rem;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        cursor: pointer;
    }

    input {
        border: 1px solid hsl(0, 0%, 80%);
        border-radius: .25rem;
        padding: .5rem 1rem;
        width: 100%;
        height: 40px;
        outline: none;
    }

    input:not(input[type="checkbox"], input[type="radio"]):focus,
    input:not(input[type="checkbox"], input[type="radio"]):hover {
        scale: 1.02;
        outline: 1px solid hsl(220, 100%, 65%);
        outline-offset: 1px;
    }

    fieldset {
        display: flex;
        gap: .5rem;
        padding: 2rem 2rem 2rem;
        border-radius: .25rem;
        margin-bottom: 1.25rem;
    }

    ul {
        display: flex;
        flex-direction: column;
        gap: .5rem;
    }

    .card:hover .carousel-img {
        transform: scale(1.2);
    }

    .comment-img {
        position: absolute;
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        object-fit: cover;
        left: 10rem;
        top: -40px;
        max-width: 8rem;
        min-height: 8rem;
        border-radius: 50%;
        border: var(--border);
    }

    .comment-message {
        line-height: 1.5;
        text-align: center;
    }

    .testimonial {
        position: relative;
        max-width: 450px;
        width: 100%;
        height: auto;
        box-shadow: var(--shadow);
        padding: 1em 2em;
        border-radius: 1rem;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
    }

    .comment {
        padding: 3rem 1rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-direction: column-reverse;
        gap: 1rem;
    }

    .comment-info {
        display: flex;
        align-items: center;
        flex-direction: column;
    }

    .stars {
        border-radius: 1rem;
        padding: .25em .75em;
        gap: .5rem;
    }

    .icon {
        color: var(--rate-color);
    }

    .stars .icon:hover {
        transform: scale(1.3);
    }
