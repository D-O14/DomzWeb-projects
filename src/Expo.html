    <div class="container">
        <h1>Task List</h1>
        <div class="container columns">
            <template class="column-template">
                <div class="column">
                    <div class="column-header">
                        <div class="column-info">
                            <h3 class="column-title"></h3>
                            <span class="task-count"></span>
                        </div>
                        <button aria-label="add task button" class="add-task-btn">
                            <span class="icon" data-icon="plus"></span>
                        </button>
                    </div>
                    <div class="tasks"></div>
                </div>
            </template>

            <template class="task-template">
                <article class="task" draggable="true">
                    <p class="task-content"></p>
                    <menu>
                        <button aria-label="edit">
                            <span class="icon edit-icon" data-icon="pen"></span>
                        </button>
                        <button aria-label="delete">
                            <span class="icon delete-icon" data-icon="delete"></span>
                        </button>
                    </menu>
                </article>
            </template>

        </div>
    </div>
</body>
