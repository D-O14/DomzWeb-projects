<style>
    :root {

        --base: var(--shade-blue-400);

        /*--brand-shade-1: hsl(from var(--brand-clr) h s calc(l + 2) / .5);
        --brand-shade-2: hsl(from var(--brand-clr) h s calc(l + 4) / .5);
        --brand-shade-3: hsl(from var(--brand-clr) h s  calc(l + 6) / .5);
        --brand-shade-4: hsl(from var(--brand-clr) h s  calc(l + 8) / .5);
        --brand-shade-5: hsl(from var(--brand-clr) h s  calc(l + 10) / .5);
        --brand-shade-6: hsl(from var(--brand-clr) h s  calc(l + 12) / .5);*/
    }

    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    body {
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: inherit;
    }

    button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        cursor: pointer;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        position: relative;
        border-radius: .25rem;
        transform-origin: bottom;
        backdrop-filter: blur(5px);
        color: hsla(0, 0%, 100%);
        -webkit-backdrop-filter: blur(5px);
        /*background: hsla(250, 50%, 60%, 0.2);*/
        border: 1px solid transparent;
        box-shadow: -4px -2px 5px hsla(0, 0%, 0%, 0.1);
        /*border: 1px solid hsla(from var(--shade-1) h s calc(l + 2) / .5);*/
    }

    menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .box {
        padding: 2em;
        height: 200px;
        flex: 0 0 300px;
        border-radius: 4px;
        width: min(500px, 80%);
        color: hsl(3, 0%, 100%);
        font-size: clamp(12px, 2vw, 1rem);
        box-shadow:
            2px 2px 0px hsla(0, 0%, 0%, 0.1),
            -2px -2px 0px hsla(0, 0%, 0%, 0.1);
        background: linear-gradient(270deg, hsl(0, 100%, 50%), hsl(30, 100%, 50%), hsl(210, 100%, 50%), hsl(220, 100%, 45%), hsl(340, 100%, 58%));
        background-size: 300% 300%;
    }

    /*@keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background: 0% 50%; }
    }*/

    .boxes {
        gap: 1rem;
        display: flex;
    }

    .btn {
        background: var(--base);
    }

    /*.linear{
        background: repeating-linear-gradient(to top right, var(--shade-1) 0px 40px, var(--shade-2) 45px 70px);
        background: linear-gradient(to bottom right, hsl(0, 100%, 50%), hsla(0, 100%, 50%, .5));
    }

    .radial{
        background: repeating-radial-gradient(circle, var(--shade-9) 0%, 10%, var(--shade-10) 10% 20%);
    }

    .conic{
        width: 200px;
        background: conic-gradient(from 45deg at 40% 60%, hsl(0, 100%, 50%), hsl(39, 100%, 50%), hsl(215, 77%, 50%),
         hsl(30, 100%, 50%), hsl(5, 100%, 50%));
    }

    .box:nth-of-type(1){
        background: color-mix(in hsl, var(--complement-shade-9) 25%, var(--complement-shade-2) 70%);
    }

    .box:nth-of-type(2){
        background: color-mix(in lch increasing hue, var(--complement-shade-9) 15%, var(--complement-shade-2) 50%);
    }

    .box:nth-of-type(3){
        background: color-mix(in oklab, var(--complement-shade-9) 50%, hsl(0, 0%, 100%) 10%);
    }*/

    h1 {
        color: transparent;
        background: linear-gradient(90deg, hsl(0, 100%, 50%), hsl(5, 100%, 50%), hsl(210, 100%, 50%));

        background-clip: text;
        -webkit-background-clip: text;
    }

    profile-card::part(view-btn){
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        cursor: pointer;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        position: relative;
        border-radius: .25rem;
        transform-origin: bottom;
        backdrop-filter: blur(5px);
        color: hsla(0, 0%, 100%);
        -webkit-backdrop-filter: blur(5px);
        background: hsla(210, 100%, 56%);
        border: 1px solid transparent;
        transition: all .3s ease-in-out;
        box-shadow: -4px -2px 5px hsla(0, 0%, 0%, 0.1);
    }

    profile-card::part(view-btn):hover{
        background: hsl(210, 100%, 46%);
    }
</style>

    <profile-card data-img="">
        <label slot="name">DomzWeb</label>
        <div slot="desc">
            <p>Web Developer from Nigeria. Also has a component library.</p>
        </div>
        <span slot="text">View Profile</span>
    </profile-card>
</body>

<script type="text/javascript" defer>
    class ProfileCard extends HTMLElement {
        static css = `
            :host {
                width: 200px;
                display: block;
                padding: 16px;
                text-align: center;
                font-size: 14px;
                font-family: 'Inter', sans-serif;
            }

            .image {
                width: 100%;
                border-radius: 50%;
                margin-bottom: 16px;
            }

            .name {
                font-size: 24px;
                font-weight: bold;
            }

            .divider {
                margin: 16px 0;
                border-top: 1px solid #eeeeee;
            }
    `

        constructor() {
            super();
            this.attachShadow({ mode: "open" });
        }

        connectedCallback() {
            const imgSrc = this.dataset.img || "https://placehold.net/400x600.png";
            this.shadowRoot.innerHTML = `
            <style>${ ProfileCard.css }</style>
            <img class="image" src="${ imgSrc }" alt="abstract image" />
            <div class="name">
                <slot name="name"></slot>   
            </div>
            <hr class="divider"/>
            <slot name="desc"></slot>
            <menu>    
                <button part="view-btn">
                    <slot name="text"><slot/>    
                </button>
            </menu>
        `;
        }
    }
    customElements.define("profile-card", ProfileCard);
</script>
