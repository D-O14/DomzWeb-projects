<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: all .5s ease;
        font-family: system-ui;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        interpolate-size: allow-keywords;
    }

    body {
        background: hsl(220, 50%, 10%);
        color: hsl(0, 0%, 20%);
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
    }

</style>
