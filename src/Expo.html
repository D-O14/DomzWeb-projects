<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
        transition: all .5s ease;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /*body {

    h1 {
        font-weight: 400;
        font-size: 16px;
    }

    img {
        width: 100%;
        height: 100%;
        display: block;
        aspect-ratio: 16/9;
        object-fit: cover;
    }

    .lock,
    .info {
        margin: 100px auto;
    }

    .shackle {
        transform-box: view-box;
        transform-origin: bottom left;
        transition: transform 300ms ease;
    }

    .lock:hover .shackle {
        transform: rotate(-15deg);
    }

    .close:hover {
        transform: rotate(1turn);
        transition: transform 1000ms ease-in-out;
    }

    .info:hover {
        transform: translateY(-10px);
    }

    .check-path {
        stroke-width: 2;
        animation: draw-check 600ms ease forwards;
    }

    /*.icon{
        padding: 10px;
        border-radius: 5rem;
        background: hsl(210, 100%, 52%);
    }*/

    .dashboard:hover .rect-1 {
        height: 5px;
    }

    .dashboard:hover .rect-2 {
        width: 15px;
    }

    .dashboard:hover .rect-3 {
        width: 20px;
        height: 20px;
    }

    .dashboard:hover .rect-4 {
        height: 10px;
        transform-box: fill-box;
        transform-origin: top;
        transform: scale(1.05);
    }

    @keyframes draw {
        to {
            stroke-dashoffset: 0;
        }
    }

    .trash:hover .trash-lid {
        transform-origin: bottom left;
        transform: translateY(-2px) rotate(-20deg);
    }

    .draw {
        animation: draw 600ms ease forwards;
    }

    span {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        background: hsl(0, 0%, 0%, .75);
        animation: ripples .6s linear infinite;
    }

    button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        cursor: pointer;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        position: relative;
        border-radius: .25rem;
        transition: all .3s ease;
        color: hsl(0, 0%, 100%);
        transform-origin: bottom;
    }

    .download-btn,
    .sync-btn {
        background: hsl(210, 100%, 52%);
        border: 1px solid hsla(210, 100%, 95%, .15);
        box-shadow:
            2px 1px 1px hsl(210, 100%, 46%),
            1px 2px 0px hsl(210, 100%, 45%),
            -1px -1px 0px hsl(210, 100%, 45%),
            -1px -1px 0px hsl(210, 100%, 45%);
    }

    .download-btn:hover,
    .sync-btn:hover {
        transform: scale(.95);
        background: hsl(210, 100%, 40%);
        border: 1px solid hsla(210, 100%, 40%);
    }

    .download-btn.active,
    .sync-btn.active {
        transform: scale(.9);
        color: hsl(0, 0%, 90%);
        background: hsl(210, 100%, 46%);
        border: 1px solid hsl(210, 100%, 46%);
    }

    .sync-btn:hover .refresh {
        transform: rotate(1turn);
        transition: transform 2s ease-in-out;
    }

    .delete-btn {
        background: hsl(0, 100%, 52%);
        border: 1px solid hsla(10, 100%, 95%, .15);
        box-shadow:
            2px 1px 1px hsl(0, 100%, 46%),
            1px 2px 0px hsl(0, 100%, 45%),
            -1px -1px 0px hsl(0, 100%, 45%),
            -1px -1px 0px hsl(0, 100%, 45%);
    }

    .delete-btn:hover {
        transform: scale(.95);
        background: hsl(0, 100%, 40%);
        border: 1px solid hsla(0, 100%, 40%);
    }

    .delete-btn.active {
        transform: scale(.9);
        color: hsl(0, 0%, 90%);
        background: hsl(0, 100%, 46%);
        border: 1px solid hsl(0, 100%, 46%);
    }

    @keyframes ripples {
        0% {
            width: 0%;
            height: 0%;
            opacity: .5;
        }

        100% {
            width: 100px;
            height: 100px;
            opacity: 0;
        }
    }

    button:hover .trash-lid {
        transform-box: fill-box;
        transform-origin: bottom left;
        transform: translateY(-2px) rotate(-20deg);
    }

    menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .grid {
        height: 100dvh;
        padding: 2em;
        display: grid;
        grid-gap: 1rem;
        /*grid-auto-flow: column;
        grid-auto-rows: 150px;
        grid-auto-columns: 300px;*/
        grid-template-rows: repeat(2, 200px);
        grid-template-columns: repeat(4, 200px);
        grid-template-areas: 
        "box-1 box-1 box-2 box-3"
        "box-4 box-4 box-4 box-5";
    }

    .item {
        background: hsl(230, 100%, 40%);
    }
</style>

<script type="text/javascript" defer>
    const buttons = document.querySelectorAll("button");

    function animatePath(paths) {
        paths.forEach(path => {
            if (path) {
                path.classList.add("draw");
                const pathLength = path.getTotalLength();
                const dashArray = path.style.strokeDasharray = pathLength;
                const dashOffset = path.style.strokeDashoffset = pathLength;
            };
        });
    };

    function createRipple(e, btn) {
        const x = e.clientX - e.target.offsetLeft;
        const y = e.clientY - e.target.offsetTop;
        const ripple = document.createElement("span");
        ripple.style.left = `${ x }px`;
        ripple.style.top = `${ y }px`;
        btn.append(ripple);
        btn.classList.add("active");
        setTimeout(() => { btn.classList.remove("active") }, 300);
        setTimeout(() => { ripple.remove() }, 600);
    }

    buttons.forEach(btn => {
        btn.addEventListener("click", (e) => {
            const paths = btn.querySelectorAll("path");
            animatePath(paths)
            createRipple(e, btn);
        });
    });
</script>
