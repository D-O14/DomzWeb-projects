<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--<link rel="stylesheet" href="/src/css/output.css">-->
    <title>Domz Cafe - Expo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Asimovian&family=DM+Serif+Text:ital@0;1&family=Electrolize&family=Paprika&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: all .5s ease;
        font-family: system-ui;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
        interpolate-size: allow-keywords;
    }

    .drop{
        width: 100px;
        height: 100px;
        border: 5px solid;
        border-style: dashed;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .drop:nth-of-type(1){
        border-color: hsl(0, 80%, 50%);
    }

    .drop:nth-of-type(2){
        border-color: hsl(185, 72%, 53%);
    }

    .draggable{
        width: 50px;
        height: 50px;
        background: hsl(0, 0%, 0%);
        cursor: grab;
    }

    .over{
        opacity: .5;
    }

</style>

<body>
    <div class="drop">
        <div class="draggable" id="draggable" draggable="true"></div>
    </div>
    <div class="drop"></div>

    <input type="file" id="fileInp">
</body>

<script type="text/javascript" defer>
    const draggable = document.querySelector(".draggable");
    draggable.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", draggable.id);
    });

    for(const drop of document.querySelectorAll(".drop")){
        drop.addEventListener("dragover", (e) => {
            e.preventDefault();
            drop.classList.add("over");
        })

        drop.addEventListener("dragleave", e => {
            drop.classList.remove("over");
        })

        drop.addEventListener("drop", (e) => {
            e.preventDefault();
            document.getElementById("fileInp").files = e.dataTransfer.files;
            const dropped = e.dataTransfer.getData("text/plain");
            const droppedElem = document.getElementById(dropped);
            drop.appendChild(droppedElem);
            drop.classList.remove("over");
        })
    }
</script>

</html>
