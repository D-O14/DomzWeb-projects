    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
    }

    dialog {
        position: fixed;
        margin: auto;
        padding: 2rem;
        border: none;
        border-radius: 8px;
        opacity: 0;
        box-shadow: 0 0 3px hsla(0, 0%, 0%, .5);
    }

    dialog[open] {
        animation: slideIn .5s ease-out forwards;
    }

    dialog.closing {
        animation: slideOut .5s ease-out forwards;
    }

    @keyframes slideIn {
        from {
            transform: translateY(-100vh);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    dialog[open]::backdrop {
        background: hsla(0, 0%, 0%, .8);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
    }

    button {
        padding: .5em 1em;
        border: none;
        border-radius: 4px;
        color: hsl(0, 0%, 95%);
        background: hsl(210, 87%, 50%);
        font-family: inherit;
        cursor: pointer;
    }

    button[onclick="drawer.close()"] {
        background: hsl(10, 87%, 50%);
        font-weight: 600;
    }

    h2 {
        font-weight: 700;
        margin-bottom: 1rem;
        text-decoration: underline;
        text-underline-offset: 6px;
    }

    input {
        outline: none;
        border: 1px solid;
        border-radius: 4px;
        padding: .5rem 1rem;
    }

    input:focus {
        outline: 2px solid;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    label {
        display: flex;
        flex-direction: column;
        gap: .5rem;
    }

    /*input:is(:-webkit-autofill, :autofill) {

    }*/
</style>

<body>
    <main>
        <section>
            <!--<picture>
                <source 
                media="(min-width: 1024px)"
                srcset=
                "https://res.cloudinary.com/dyyvwfgqr/image/upload/f_auto,q_auto,w_1200/cafe_14_pii7sq.webp 1200w,

            <button id="open-drawer" onclick="drawer.showModal()">Sign Up</button>
            <dialog id="drawer" aria-labelledby="drawer-title">
                <h2 id="drawer-title">Sign Up</h2>
                <form action="" method="get" id="form" name="SignUpForm">

                    <label for="name" class="name-label">
                        Name
                        <input type="text" aria-labelledby="name-label" name="name" placeholder="Enter Your Full Name"
                            inputmode="text" autocapitalize="words" enterkeyhint="next" autocomplete="name" required 
                            autocorrect="on">
                    </label>

                    <label id="tel-label" for="tel">
                        Phone no:
                        <input aria-labelledby="tel-label" placeholder="091-6456-9891" type="tel" name="number"
                            autocomplete="tel" enterkeyhint="next" inputmode="numeric" required 
                            pattern="0[789][01][0-9]{8}">
                    </label>

                    <label id="email-label" for="email">
                        Email
                        <input aria-labelledby="email-label" placeholder="Example@gmail.com" type="email" name="email"
                            autocomplete="email" enterkeyhint="next" inputmode="email" required>
                    </label>

                    <label id="pass-label" for="password">
                        Password
                        <input aria-labelledby="pass-label" placeholder="Password" type="password" name="pass"
                         autocomplete="current-password" enterkeyhint="send" inputmode="numeric" required minlength="8" maxlength="12">
                    </label>

                    <menu>
                        <button value="Submit" aria-label="Submit" type="submit" onclick="form.requestSubmit()">&check;</button>
                        <button value="cancel" onclick="drawer.close()" type="button" aria-label="Close" id="close">&times;</button>
                    </menu>

                </form>
            </dialog>
        </section>
    </main>

</body>
