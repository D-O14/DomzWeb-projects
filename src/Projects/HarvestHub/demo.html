<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestHub Demo</title>
</head>

<body>
    <main class="app" id="app">
        <article class="product-card">
            <div class="card-header">
                <span class="product-category">Poultry</span>
                <figure class="product-img">
                    <!--<span class="img">🐓</span>-->
                    <img src="../../Assets/Images/3d-coffee-cup.webp" alt="" loading="lazy" fetchpriority="high" decoding="async">
                </figure>
                <button class="wishlist-btn" aria-label="Add to wishlist">
                    <span class="icon heart-icon" data-icon="heart"></span>
                </button>
            </div>
            <div class="card-content">
                <div class="product-specs">
                    <h3 class="product-name">
                        <a href="#">Live Local Chicken</a>
                    </h3>
                    <span class="product-price">₦18,500</span>
                </div>
                <p class="product-desc">
                    Sample listing. Size and weight vary by animal.
                </p>
                <menu class="card-actions">
                    <button class="cart-btn" aria-label="Add to Cart">
                        <span class="icon cart-icon" data-icon="shoppingCart"></span>
                    </button>
                    <a class="details-btn">
                        View Details
                        <span class="icon details-icon" data-icon="attachment"></span>
                    </a>
                </menu>
            </div>
        </article>
    </main>
</body>

<script type="module" src="./demo.js" defer></script>

</html>
