<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HarvestHub | Agricultural supermarket, Benin City</title>
    <meta name="description" content="Livestock, poultry, frozen foods, produce and staples. Retail and bulk supply from HarvestHub." />
    <meta property="og:title" content="HarvestHub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="bar" id="bar"></div>

    <header class="head">
      <div class="wrap head__in">
        <a class="mark" href="#/"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 24V11M13 11C13 6 9 3 4 3c0 5 3 8 9 8zm0 3c0-4 3-6 8-6 0 4-3 6-8 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>HarvestHub</a>

        <nav class="nav" id="nav" aria-label="Main">
          <a href="#/shop">Shop</a>
          <a href="#/wholesale">Wholesale</a>
          <a href="#/delivery">Delivery</a>
          <a href="#/about">About</a>
        </nav>

        <form class="find" id="find" role="search">
          <input id="findInput" type="search" placeholder="Search the market" aria-label="Search" list="names" />
          <datalist id="names"></datalist>
        </form>

        <button class="pill" data-act="cart" aria-label="Open cart">Cart <b id="count">0</b></button>
        <button class="pill menu" data-act="menu" aria-label="Menu">Menu</button>
      </div>
    </header>

    <main id="app"></main>

    <footer class="foot">
      <div class="wrap foot__grid">
        <div><div class="mark mark--l">HarvestHub</div><p id="footAddr"></p></div>
        <div><h4>Shop</h4><div id="footCats"></div></div>
        <div><h4>Help</h4><a href="#/delivery">Delivery and collection</a><a href="#/wholesale">Bulk supply</a><a href="#/about">Policies</a></div>
        <div><h4>Contact</h4><div id="footContact"></div></div>
      </div>
      <p class="wrap foot__note">Demonstration store. Products, prices and contact details are sample data.</p>
    </footer>

    <div class="scrim" id="scrim" data-act="close"></div>
    <aside class="drawer" id="drawer" aria-label="Cart">
      <div class="drawer__top"><h2>Your cart</h2><button data-act="close">Close</button></div>
      <div class="drawer__body" id="dBody"></div>
      <div class="drawer__bot" id="dFoot"></div>
    </aside>

    <a class="wa" id="wa" target="_blank" rel="noopener">WhatsApp</a>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
