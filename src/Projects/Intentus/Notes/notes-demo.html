    <div class="selection-toolbar">
        <div class="toolbar-header">
            <button class="backBtn" aria-label="Back" id="exitSelectionBtn">
                <span class="icon">
                    <i data-lucide="chevronLeft" width="30" height="30"></i>
                </span>
            </button>
            <h2 class="selected-count">9 Notes Selected</h2>
            <label for="selectAll">
                <input type="checkbox" id="selectAll">
            </label>
        </div>
        <menu class="toolbar-nav">
            <button>
                <span class="icon">
                    <i data-lucide="pin" width="30" height="30"></i>
                </span>
                <span class="text">Pin</span>
            </button>
            <button>
                <span class="icon">
                    <i data-lucide="lockKeyhole" width="30" height="30"></i>
                </span>
                <span class="text">Lock</span>
            </button>
            <button>
                <span class="icon">
                    <i data-lucide="folderSymlink" width="30" height="30"></i>
                </span>
                <span class="text">Move</span>
            </button>
            <button>
                <span class="icon">
                    <i data-lucide="share" width="30" height="30"></i>
                </span>
                <span class="text">Share</span>
            </button>

            <button>
                <span class="icon">
                    <i data-lucide="trash2" width="30" height="30"></i>
                </span>
                <span class="text">Delete</span>
            </button>
        </menu>
    </div>
