    <menu>
        <button class="filter-btn" aria-label="Filter">
            <span class="icon" data-icon="filter"></span>
        </button>
        <button class="sort-btn" aria-label="Sort">
            <span class="icon" data-icon="sort"></span>
        </button>
    </menu>
    <div class="row">
        <menu class="filter-row">
            <button class="filter-chip active">
                All
                <span class="icon" data-icon="tick"></span>
            </button>
            <button class="filter-chip">
                Today
                <span class="icon" data-icon=""></span>
            </button>
            <button class="filter-chip">
                Yesterday
                <span class="icon" data-icon=""></span>
            </button>
            <button class="filter-chip">
                This week
                <span class="icon" data-icon=""></span>
            </button>
            <button class="filter-chip">
                Older
                <span class="icon" data-icon=""></span>
            </button>
        </menu>
        <menu class="sort-row">
            <button class="sort-chip active">
                Recently Updated
                <span class="icon" data-icon="tick"></span>
            </button>
            <button class="sort-chip">
                Newest First
                <span class="icon" data-icon=""></span>
            </button>
            <button class="sort-chip">
                Oldest First
                <span class="icon" data-icon=""></span>
            </button>
            <button class="sort-chip">
                Title A-Z
                <span class="icon" data-icon=""></span>
            </button>
            <button class="sort-chip">
                Title Z-A
                <span class="icon" data-icon=""></span>
            </button>
        </menu>
    </div>
