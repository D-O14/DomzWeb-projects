<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./notes_app.css">
    <title>Quick Notes</title>
</head>

<body>

    <header>
        <h1>Quick Notes</h1>
        <menu>
            <button class="addNoteBtn" id="addNoteBtn" aria-label="Add note button">
                <span class="icon" data-icon="pen"></span>
            </button>
            <button id="themeBtn" class="themeBtn" aria-label="Theme switch button">
                <span class="icon" data-icon="moon"></span>
            </button>
        </menu>
    </header>

    <main id="notes" class="notes">
        <template id="noteTemplate">
            <article class="note-card" id="noteCard" data-id="">
                <span class="quick-note">Quick Note</span>
                <h3 class="note-title"></h3>
                <p class="note-content"></p>
                <menu class="note-actions">
                    <button class="copyBtn" id="copyBtn" aria-label="Copy note button">
                        <span class="icon" data-icon="copy"></span>
                    </button>
                    <button class="deleteBtn" id="deleteBtn" aria-label="Delete note button">
                        <span class="icon" data-icon="delete"></span>
                    </button>
                    <button class="editBtn" id="editBtn" aria-label="Edit note button">
                        <span class="icon" data-icon="pencil"></span>
                    </button>
                    <button class="shareBtn" id="shareBtn" aria-label="share button">
                        <span class="icon" data-icon="share"></span>
                    </button>
                </menu>
            </article>
        </template>

        <template id="emptyState">
            <div class="empty-container">
                <div class="empty-state">
                    <span class="quick-note">Quick Note</span>
                    <h2 class="empty-header">No Notes Yet</h2>
                    <p class="empty-text">Create your first note to get started</p>
                </div>
            </div>
        </template>
    </main>

    <dialog id="dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                <button class="closeBtn" id="closeBtn" aria-label="Close dialog button">
                    <span class="icon" data-icon="close"></span>
                </button>
            </div>

            <form id="form" novalidate autocomplete="off" autocorrect="off">
                    <label for="noteTitle" class="form-label">
                        Title
                        <input type="text" class="form-input" id="noteTitle" name="note title" autocapitalize="on" 
                        autofocus placeholder="Enter Note Title..">
                    </label>
                    <label for="noteContent" class="form-label">
                        Content
                        <textarea id="noteContent" name="note content" class="form-textarea" placeholder="Write your note here..."></textarea>
                    </label>
                <menu class="dialog-actions">
                    <button type="button" class="cancelBtn" id="cancelBtn">Cancel</button>
                    <button type="submit" class="saveBtn" id="saveBtn">Save Note</button>
                </menu>
            </form>
        </div>
    </dialog>

</body>

<script src="./notes_app.js" type="module" defer></script>
</html>
