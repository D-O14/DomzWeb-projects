    <title>Intentus - Quick Notes</title>
</head>

<body>
    <header>
        <h1>Quick Notes</h1>
        <div class="header-content">
            <search-input class="note-search" placeholder="Search through your notes...">
                <span slot="icon" class="icon search-icon">
                    <i data-lucide="bookSearch"></i>
                </span>
            </search-input>
            <menu class="header-menu">
                <button class="layoutBtn" aria-label="Layout Change Button">
                    <span class="icon" data-icon="dashboard"></span>
                </button>
                <button id="themeBtn" class="themeBtn" aria-label="Theme switch button">
                    <span class="icon" data-icon="moon"></span>
                </button>
                <button id="filterBtn" class="filterBtn" data-trigger="filter" aria-label="Filter button">
                    <span class="icon" data-icon="filter"></span>
                </button>
                <button id="sortBtn" class="sortBtn" data-trigger="sort" aria-label="Sort button">
                    <span class="icon" data-icon="sort"></span>
                </button>
            </menu>
        </div>
    </header>
    <toast-notif></toast-notif>
    <div class="rows">
        <menu class="filter-row row">
            <template id="filterTemplate">
                <button class="chip">
                
                </button>
            </template>
        </menu>
        <menu class="sort-row row">
            <template id="sortTemplate">
                <button class="chip">
        
                </button>
            </template>
        </menu>
    </div>
    <main id="notes" class="notes">
        <template id="noteTemplate">
            <article class="note-card" id="noteCard" data-id="">
                <label class="check">
                    <input type="checkbox" class="checkbox" id="" aria-label="Select note">
                    <span class="custom-check"></span>
                </label>
                <span class="quick-note">Quick Note</span>
                <time class="note-date" data-created-at=""></time>
                <h3 class="note-title"></h3>
                <p class="note-content"></p>
                <menu class="note-actions">
                    <button class="copyBtn" id="copyBtn" aria-label="Copy note button">
                        <span class="icon" data-icon="copy"></span>
                    </button>
                    <button class="editBtn" id="editBtn" aria-label="Edit note button">
                        <span class="icon" data-icon="pencil"></span>
                    </button>
                </menu>
            </article>
        </template>

        <template id="emptyState">
            <div class="empty-state">
                <span class="quick-note">Quick Note</span>
                <img src="../../../Assets/Illustrations/add-notes.svg" alt="" class="empty-img">
                <h2 class="empty-header">No Notes Yet</h2>
                <p class="empty-text">Create your first note to get started</p>
            </div>
        </template>
        <template id="noResults">
            <div class="no-results">
                <img src="../../../Assets/Illustrations/note-search.svg" alt="" class="results-img">
                <h2 class="results-header">No Notes Found...</h2>
                <p class="results-msg">
                    Try putting in another query instead
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide search">
                            <path d="m21 21-4.34-4.34" />
                            <circle cx="11" cy="11" r="8" />
                        </svg>
                    </span>
                </p>
            </div>
        </template>
    </main>

    <div class="toolbar-view">
        <div class="selection-toolbar">
            <p>Notes Selected <span class="selected-count"></span></p>
            <p class="select-all"></p>
            <menu class="toolbar-menu">
                <button class="select-btn" aria-label="Export">
                    <span class="icon" data-icon="upload"></span>
                </button>
                <button class="select-btn" aria-label="Share">
                    <span class="icon" data-icon="share"></span>
                </button>
                <button class="select-btn delete">
                    <span class="icon" data-icon="delete"></span>
                    Delete
                </button>
            </menu>
            <button class="toolbar-close" aria-label="close">
                <span class="icon" data-icon="close"></span>
            </button>
        </div>
    </div>

    <div class="view">
        <div class="tooltip">
            <p class="content">Create Note</p>
        </div>
        <button class="addNoteBtn" id="addNoteBtn" aria-label="Create Note">
            <span class="icon" data-icon="pen"></span>
        </button>
    </div>

    <dialog id="dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                <button class="closeBtn" id="closeBtn" aria-label="Close dialog button">
                    <span class="icon" data-icon="dismiss"></span>
                </button>
            </div>

            <form id="form" novalidate autocomplete="off" autocorrect="off">
                <label for="noteTitle" class="form-label">
                    Title
                    <input type="text" class="form-input" id="noteTitle" name="note title" autocapitalize="on" autofocus
                        placeholder="Enter Note Title..">
                </label>
                <label for="noteContent" class="form-label">
                    Content
                    <textarea id="noteContent" name="note content" class="form-textarea"
                        placeholder="Write your note here..."></textarea>
                </label>
                <menu class="dialog-actions">
                    <button type="button" class="cancelBtn" id="cancelBtn">Cancel</button>
                    <button type="submit" class="saveBtn" id="saveBtn">Save Note</button>
                </menu>
            </form>
        </div>
    </dialog>

</body>

<script src="./notes_app.js" type="module" defer></script>

</html>
