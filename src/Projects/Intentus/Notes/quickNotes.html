    <title>Intentus - Quick Notes</title>
</head>

<body>
    <header>
        <h1 class="title">Quick Notes</h1>
        <div class="header-content">
            <search-input class="note-search" placeholder="Search through your notes...">
                <span slot="icon" class="icon search-icon">
                    <i data-lucide="bookSearch"></i>
                </span>
            </search-input>
            <menu class="header-menu">
                <button id="layoutBtn" class="header-btn layoutBtn" aria-label="Layout Change Button">
                    <span class="icon" data-icon="dashboard"></span>
                </button>
                <button id="themeBtn" class="header-btn themeBtn" aria-label="Theme switch button">
                    <span class="icon" data-icon="moon"></span>
                </button>
                <button id="filterBtn" class="header-btn filterBtn" data-trigger="filter" aria-label="Filter button">
                    <span class="icon" data-icon="filter"></span>
                </button>
                <button id="sortBtn" class="header-btn sortBtn" data-trigger="sort" aria-label="Sort button">
                    <span class="icon" data-icon="sort"></span>
                </button>
            </menu>
        </div>
    </header>

    <toast-notif></toast-notif>

    <div class="selection-toolbar">
        <div class="toolbar-body">
            <button class="backBtn" aria-label="Back" id="exitSelectionBtn">
                <span>
                    <i data-lucide="x" width="25" height="25"></i>
                </span>
            </button>
            <p class="selected-count"></p>
            <menu class="toolbar-nav">
                <button>
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#2b00ff" viewBox="0 0 256 256">
                            <path
                                d="M229.66,98.34,172.39,155.8c11.46,22.93-1.72,45.86-10.11,57a8,8,0,0,1-12,.83L42.34,105.76A8,8,0,0,1,43,93.85c29.65-23.92,57.4-10,57.4-10l57.27-57.46a8,8,0,0,1,11.31,0L229.66,87A8,8,0,0,1,229.66,98.34Z"
                                opacity="0.2"></path>
                            <path
                                d="M235.32,81.37,174.63,20.69a16,16,0,0,0-22.63,0L98.37,74.49c-10.66-3.34-35-7.37-60.4,13.14a16,16,0,0,0-1.29,23.78L85,159.71,42.34,202.34a8,8,0,0,0,11.32,11.32L96.29,171l48.29,48.29A16,16,0,0,0,155.9,224c.38,0,.75,0,1.13,0a15.93,15.93,0,0,0,11.64-6.33c19.64-26.1,17.75-47.32,13.19-60L235.33,104A16,16,0,0,0,235.32,81.37ZM224,92.69h0l-57.27,57.46a8,8,0,0,0-1.49,9.22c9.46,18.93-1.8,38.59-9.34,48.62L48,100.08c12.08-9.74,23.64-12.31,32.48-12.31A40.13,40.13,0,0,1,96.81,91a8,8,0,0,0,9.25-1.51L163.32,32,224,92.68Z">
                            </path>
                        </svg>
                    </span>
                    <span class="text">Pin</span>
                </button>
                <button>
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#2b00ff" viewBox="0 0 256 256">
                        <path
                            d="M208,88H48a8,8,0,0,0-8,8V208a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V96A8,8,0,0,0,208,88Zm-80,72a20,20,0,1,1,20-20A20,20,0,0,1,128,160Z"
                            opacity="0.2"></path>
                        <path
                            d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-80-96a28,28,0,0,0-8,54.83V184a8,8,0,0,0,16,0V166.83A28,28,0,0,0,128,112Zm0,40a12,12,0,1,1,12-12A12,12,0,0,1,128,152Z">
                        </path>
                    </svg>
                    </span>
                    <span class="text">Lock</span>
                </button>
                <button>
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#2b00ff" viewBox="0 0 256 256">
                            <path d="M208,200a32,32,0,1,1-32-32A32,32,0,0,1,208,200ZM176,88a32,32,0,1,0-32-32A32,32,0,0,0,176,88Z"
                                opacity="0.2"></path>
                            <path
                                d="M176,160a39.89,39.89,0,0,0-28.62,12.09l-46.1-29.63a39.8,39.8,0,0,0,0-28.92l46.1-29.63a40,40,0,1,0-8.66-13.45l-46.1,29.63a40,40,0,1,0,0,55.82l46.1,29.63A40,40,0,1,0,176,160Zm0-128a24,24,0,1,1-24,24A24,24,0,0,1,176,32ZM64,152a24,24,0,1,1,24-24A24,24,0,0,1,64,152Zm112,72a24,24,0,1,1,24-24A24,24,0,0,1,176,224Z">
                            </path>
                        </svg>
                    </span>
                    <span class="text">Share</span>
                </button>
            
                <button class="delete-btn">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ff0000" viewBox="0 0 256 256">
                            <path d="M200,56V208a8,8,0,0,1-8,8H64a8,8,0,0,1-8-8V56Z" opacity="0.2"></path>
                            <path
                                d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z">
                            </path>
                        </svg>
                    </span>
                    <span class="del-text">Delete</span>
                </button>
                <label class="select" for="selectAll">
                    <input type="checkbox" class="check" id="selectAll" aria-label="Select note">
                    <span class="select-box"></span>
                </label>
            </menu>
        </div>
    </div>

    <div class="rows">
        <menu class="filter-row row">
            <template id="filterTemplate">
                <button class="chip">
                
                </button>
            </template>
        </menu>
        <menu class="sort-row row">
            <template id="sortTemplate">
                <button class="chip">
        
                </button>
            </template>
        </menu>
    </div>

    <main id="notes" class="notes">
        <template id="noteTemplate">
            <article class="note-card" id="noteCard" data-id="">
                <label class="check">
                    <input type="checkbox" class="checkbox" id="" aria-label="Select note">
                    <span class="custom-check"></span>
                </label>
                <span class="quick-note">Quick Note</span>
                <time class="note-date" data-created-at=""></time>
                <h3 class="note-title"></h3>
                <p class="note-content"></p>
                <menu class="note-actions">
                    <button class="copyBtn" id="copyBtn" aria-label="Copy note button">
                        <span class="icon" data-icon="copy"></span>
                    </button>
                    <button class="editBtn" id="editBtn" aria-label="Edit note button">
                        <span class="icon" data-icon="pencil"></span>
                    </button>
                </menu>
            </article>
        </template>

        <template id="emptyState">
            <div class="empty-state">
                <span class="quick-note">Quick Note</span>
                <img src="../../../Assets/Illustrations/add-notes.svg" alt="" class="empty-img">
                <h2 class="empty-header">No Notes Yet</h2>
                <p class="empty-text">Create your first note to get started</p>
            </div>
        </template>
        
        <template id="noResults">
            <div class="no-results">
                <img src="../../../Assets/Illustrations/note-search.svg" alt="" class="results-img">
                <h2 class="results-header">No Notes Found...</h2>
                <p class="results-msg">
                    Try putting in another query instead
                    <span class="icon" data-icon="search"></span>
                </p>
            </div>
        </template>
    </main>

    <div class="view">
        <div class="tooltip">
            <p class="content">Create Note</p>
        </div>
        <button class="addNoteBtn" id="addNoteBtn" aria-label="Create Note">
            <span class="icon" data-icon="pen"></span>
        </button>
    </div>

    <dialog id="dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                <button class="closeBtn" id="closeBtn" aria-label="Close dialog button">
                    <span class="icon" data-icon="dismiss"></span>
                </button>
            </div>

            <form id="form" novalidate autocomplete="off" autocorrect="off">
                <label for="noteTitle" class="form-label">
                    Title
                    <input type="text" class="form-input" id="noteTitle" name="note title" autocapitalize="on" autofocus
                        placeholder="Enter Note Title..">
                </label>
                <label for="noteContent" class="form-label">
                    Content
                    <textarea id="noteContent" name="note content" class="form-textarea"
                        placeholder="Write your note here..."></textarea>
                </label>
                <menu class="dialog-actions">
                    <button type="button" class="cancelBtn" id="cancelBtn">Cancel</button>
                    <button type="submit" class="saveBtn" id="saveBtn">Save Note</button>
                </menu>
            </form>
        </div>
    </dialog>

</body>

<script src="./quickNotes.js" type="module" defer></script>
</html>
