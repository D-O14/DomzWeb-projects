<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="preload" as="style" onload="this.rel = 'stylesheet'" href="/src/css/todo.css">
</head>

<body>
    <main>
        <form action="" autocomplete="off">
            <input type="text" name="toDoListInput" placeholder="Write out your task">
            <button class="addBtn">Add Task</button>
        </form>

        <div class="container">

            <template id="taskTemplate">
                <div class="todo" data-id="">
                    <label class="check">
                        <input type="checkbox" class="check" id="check">
                        <span class="custom-box"></span>
                    </label>
                    <div class="list-wrapper">
                        <p class="list" contenteditable="true"></p>
                        <span class="date"></span>
                    </div>

                    <button class="del" aria-label="delete button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-trash">
                            <path d="M10 11v6" />
                            <path d="M14 11v6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                            <path d="M3 6h18" />
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                    </button>
                </div>
            </template>

            <template id="emptyTemplate">
                <div>
                    <p class="empty-state">
                        No tasks yet. Start creating some
                    </p>
                </div>
            </template>

        </div>

    </main>

</body>

<script src="/src/js/todo.js" defer type="module"></script>

</html>
