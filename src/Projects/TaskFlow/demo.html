    <div class="task-edit-panel">
        <div class="panel-header">
            <span class="icon" data-icon="close"></span>
        </div>
        <h3 class="task-title">Dashboard Project</h3>
        <div class="task-info">
            <label>
                <span class="icon history-icon" data-icon="history"></span>
                Created At
                <p>September 20, 2026 10:35AM</p>
            </label>
            <label>
                <span class="icon loading-icon" data-icon="loading"></span>
                Status
                <p class="status">
                    <span class="dot"></span>
                    <span class="status-text">In Progress</span>
                </p>
            </label>
            <label>
                <span class="icon priority-icon" data-icon="priority"></span>
                <span class="priority-badge low">Low</span>
            </label>
            <label>
                <span class="icon calendar-icon" data-icon="calendar"></span>
                Due Date
                <p>October 20, 2026 14:00PM</p>
            </label>
            <label>
                <span class="icon tag-icon" data-icon="tag"></span>
                Tags
                <span class="tag">Task</span>
                <span class="tag">Wireframe</span>
                <span class="tag">Dashboard</span>
            </label>
        </div>
        <div class="task-desc">
            <h3>Project Description</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Necessitatibus accusamus alias
            inventore dignissimos exercitationem tempora recusandae itaque cumque quis sunt.</p>
        </div>
    </div>
