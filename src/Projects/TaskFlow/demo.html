<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow demo</title>
</head>

<body>
    <template class="task-template">
        <article class="task" draggable="true">
            <div class="task-header">
                <time class="created-at">
                    <span class="date"></span>
                    <span class="icon date-icon" data-icon="calendar"></span>
                </time>
                <span class="priority-badge"></span>
            </div>
            <div class="task-body">
                <div class="task-input" contenteditable>
                    <h4 class="task-title"></h4>
                    <p class="task-content"></p>
                </div>
            </div>
            <hr />  
            <div class="task-footer">
                <menu>
                    <button aria-label="delete task" class="delete-task-btn">
                        <span class="icon delete-icon" data-icon="delete"></span>
                    </button>
                </menu>
                <div class="tags">

                </div>
            </div>
        </article>
    </template>

    <template class="tag-template">
        <span class="tag"></span>
    </template>
    <template class="panel-template">
        <aside class="task-edit-panel">
            <div class="panel-header">
                <button aria-label="Close Details Panel">
                    <span class="icon close-panel-icon" data-icon="close"></span>
                </button>
            </div>
            <div class="panel-body">
                <h3 class="task-details-title"></h3>
                <div class="task-metadata">
                    <label class="metadata-row">
                        <span class="metadata-label">
                            <span class="icon history-icon" data-icon="history"></span>
                            Created At
                        </span>
                        <p class="created-date metadata-value"></p>
                    </label>
                    <label class="metadata-row">
                        <span class="metadata-label">
                            <span class="icon loading-icon" data-icon="loading"></span>
                            Status
                        </span>
                        <p class="metadata-value status">
                            <span class="dot"></span>
                            <span class="status-text"></span>
                        </p>
                    </label>
                    <label class="metadata-row">
                        <span class="metadata-label">
                            <span class="icon priority-icon" data-icon="priority"></span>
                            Priority
                        </span>
                        <span class="metadata-value priority-badge"></span>
                    </label>
                    <label class="metadata-row">
                        <span class="metadata-label">
                            <span class="icon calendar-icon" data-icon="calendar"></span>
                            Due Date
                        </span>
                        <p class="due-date metadata-value"></p>
                    </label>
                    <label class="metadata-row">
                        <span class="metadata-label">
                            <span class="icon tag-icon" data-icon="tag"></span>
                            Tags
                        </span>
                        <p class="tags metadata-value"></p>
                        <button class="add-tag-btn">
                            <span class="icon" data-icon="plus"></span>
                        </button>
                    </label>
                </div>
                <div class="project-desc">
                    <h3>Project Description</h3>
                    <p class="task-desc"></p>
                </div>
            </div>
            <form class="edit-form">
                <h3 class="form-header">Edit Task Details</h3>
                <label for="dueDatePicker" class="input-label">
                    <div class="label">
                        <span class="icon" data-icon="calendar"></span>
                        Due Date
                    </div>
                    <input type="date" class="date-picker" id="dueDatePicker">
                </label>
                <label for="priorityDropDown" class="input-label">
                    <div class="label">
                        <span class="icon" data-icon="priority"></span>
                        Priority
                    </div>
                    <select id="priorityDropDown" class="priority-select">
                        <option value="Choose Priority">Choose Priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </label>
            </form>
        </aside>
    </template>
</body>
<script type="module" src="./demo.js" defer></script>

</html>
