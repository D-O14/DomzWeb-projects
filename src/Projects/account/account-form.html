<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Creation Form</title>
    <link rel="preload" as="style" onload="this.rel='stylesheet'" href="./account-form.css">
</head>

<body>
    <div class="container">
        <div class="image">
            <img src="../../Assets/Images/abstract-waves.jpg" alt="">
        </div>
        <div class="form">
            <form action="../../Components/Profile_card.html" enctype="multipart/form-data" novalidate autocomplete="on"
                autocorrect="on" spellcheck="true" autocapitalize="on">
                <!--<drop-zone></drop-zone>-->
                <div class="input-group">
                    <label>
                        <div class="input">
                            <span class="icon" data-icon="user"></span>
                            <input type="text" placeholder="R$ndomJ-ohn12" enterkeyhint="next" required id="username"
                                name="username" pattern="^[A-Za-z\s'.\-]+$" autofocus>
                        </div>
                        <p class="error-text" aria-live="polite"></p>
                    </label>
                    <label>
                        <div class="input">
                            <span class="icon" data-icon="atSymbol"></span>
                            <input type="text" placeholder="@johndoe" enterkeyhint="next" required id="handle"
                                name="handle">
                        </div>
                        <p class="error-text" aria-live="polite"></p>
                    </label>
                </div>
                <label>
                    <div class="input">
                        <span class="icon" data-icon="mail"></span>
                        <input type="email" placeholder="jonathandoe@gmail.com" enterkeyhint="next" required id="email"
                            name="email" inputmode="email">
                    </div>
                    <p class="error-text" aria-live="polite"></p>
                </label>
                <label>
                    <div class="input">
                        <span class="icon" data-icon="phone"></span>
                        <input type="tel" placeholder="+144 500 391 065" enterkeyhint="next"
                            required id="contact" name="contact" pattern="^[+?0-9\s]{7,20}" inputmode="tel"
                            maxlength="20">
                    </div>
                    <p class="error-text" aria-live="polite"></p>
                </label>
                <label>
                    <div class="input">
                        <span class="icon" data-icon="userLock"></span>
                        <input type="password" placeholder="P-@$_sw0rd" enterkeyhint="next"
                            required id="password" name="password">
                    </div>
                    <p class="error-text" aria-live="polite"></p>
                </label>
                <label>
                    <textarea placeholder="Tell us a bit about yourself (optional)" enterkeyhint="done" maxlength="200"
                        name="bio"></textarea>
                    <p class="chars" aria-live="polite"></p>
                </label>
                <menu>
                    <button type="button">Create Account</button>
                </menu>
            </form>
        </div>
    </div>
</body>

<script src="./account-form.js" type="module" defer></script>
<script src="../../Components/dropzone/dropzone.js" type="module"></script>

</html>
