<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Creation Form</title>
    <link rel="preload" as="style" onload="this.rel='stylesheet'" href="./account-form.css">
</head>

<body>
    <form action="../../Components/Profile_card.html" enctype="multipart/form-data" novalidate autocomplete="on"
        autocorrect="on" spellcheck="true" autocapitalize="on">
        <drop-zone></drop-zone>
        <label>
            <div class="input">
                <span class="icon"></span>
                <input type="text" placeholder="What would you like to be called?" enterkeyhint="next" required
                    id="username" name="username" pattern="^[A-Za-z\s'.\-]+$" autofocus>
            </div>
            <p class="error-text" aria-live="polite"></p>
        </label>
        <label>
            <div class="input">
                <span class="icon"></span>
                <input type="text" placeholder="Please provide a handle e.g. @johndoe" enterkeyhint="next" required
                    id="handle" name="handle">
            </div>
            <p class="error-text" aria-live="polite"></p>
        </label>
        <label>
            <div class="input">
                <span class="icon"></span>
                <input type="email" placeholder="What's your E-mail?" enterkeyhint="next" required id="email"
                    name="email" inputmode="email">
            </div>
            <p class="error-text" aria-live="polite"></p>
        </label>
        <label>
            <div class="input">
                <span class="icon"></span>
                <input type="password" placeholder="Set up a safe and secure password" enterkeyhint="next" required
                    id="password" name="password" pattern="">
            </div>
            <p class="error-text" aria-live="polite"></p>
        </label>
        <label>
            <div class="input">
                <span class="icon"></span>
                <input type="date" enterkeyhint="next" required id="date" name="birthday">
            </div>
            <p class="error-text" aria-live="polite"></p>
        </label>
        <label>
            <div class="input">
                <span class="icon"></span>
                <input type="tel" placeholder="What number do we use to contact you?" enterkeyhint="next" required id="contact"
                    name="contact" pattern="^[+?0-9\s]{7,20}" minlength="7" maxlength="20">
            </div>
            <p class="error-text" aria-live="polite"></p>
        </label>
        <label>
            <textarea placeholder="Tell us a bit about yourself" maxlength="200" name="bio"></textarea>
        </label>
        <menu>
            <button type="button">Submit</button>
        </menu>
    </form>
</body>

<script src="./account-form.js" type="module" defer></script>
<script src="../../Components/dropzone/dropzone.js" type="module"></script>

</html>
