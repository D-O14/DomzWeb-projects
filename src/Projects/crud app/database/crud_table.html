<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CRUD App Table</title>
    <link rel="preload" as="style" onload="this.rel='stylesheet'" href="./crud_table.css">
</head>

<body>
    <main>
        <section id="section">
            <div class="table-container">
                <table class="table">
                    <thead class="header">
                        <th>Id</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Date Of birth</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Options</th>
                    </thead>
                    <tbody class="body" id="body">
                
                    </tbody>
                    </table>
            </div>
        </section>
    </main>    
</body>

<script src="./crud_table.js" type="module" defer></script>
</html>
