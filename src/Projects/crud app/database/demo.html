<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Database Demo</title>
    <link rel="stylesheet" href="./demo.css">
</head>

<body>
    <div class="table-container">
        <div class="table-head">
            <h1 class="table-header">
                Users
                <span class="user-count"></span>
            </h1>
            <search-input placeholder="Search through your users...">
                <span slot="icon" class="icon search-icon">
                    <i data-lucide="search"></i>
                </span>
            </search-input>
        </div>
        <table>
            <thead>
                <th>
                    <check-box></check-box>
                </th>
                <template class="header-template">
                    <th>
                        <div class="content">

                        </div>
                    </th>
                </template>
            </thead>
            <tbody>
                <template class="row-template">
                    <tr>
                        <td class="user-select">
                            <check-box></check-box>
                        </td>
                        <td class="user-id"></td>
                        <td class="user-name">
                            <span class="icon" data-icon="user"></span>
                            <span class="name"></span>
                        </td>
                        <td class="user-email">
                            <a href="mailto:" class="mailto"></a>
                        </td>
                        <td class="user-status">
                            <span class="indicator"></span>
                            <span class="status"></span>
                        </td>
                        <td class="user-createdAt"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</body>

<script type="module" src="./demo.js" defer></script>
<script type="module" src="../../../Components/form/checkbox/checkbox.js" defer></script>
<script type="module" src="../../../Components/form/search/searchInput.js" defer></script>

</html>
