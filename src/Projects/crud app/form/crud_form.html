<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Creation Form</title>
</head>

<body>
    <main>
        <section>
            <form spellcheck="true" autocomplete="off" enctype="application/x-www-form-urlencoded">
                <label for="name">
                    <div class="label">
                        <span class="icon" data-icon="user"></span>
                        Name:
                    </div>
                    <input type="text" id="nameInput" placeholder="John Doe" required name="name" autofocus
                        enterkeyhint="next">
                </label>

                <label for="email">
                    <div class="label">
                        <span class="icon" data-icon="mail"></span>
                        E-mail:
                    </div>
                    <input type="email" id="emailInput" placeholder="Your_email@gmail.com" required name="email"
                        enterkeyhint="next" inputmode="email">
                </label>

                <label>
                    Gender:
                    <div class="gender">
                        <label class="male" for="male">
                            <input type="radio" name="gender" id="male" value="Male">
                            Male
                        </label>

                        <label class="female" for="female">
                            <input type="radio" name="gender" id="female" value="Female">
                            Female
                        </label>
                    </div>
                </label>


                <label for="dob">
                    <div class="label">
                        <span class="icon" data-icon="calendar"></span>
                        Date of Birth:
                    </div>
                    <input type="date" id="dobInput" placeholder="DD-MM-YYYY" required name="birthday" enterkeyhint="next">
                </label>

                <label for="password">
                    <div class="label">
                        <span class="icon" data-icon="eye"></span>
                        Password:
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="passwordInput" placeholder="P@$sw0rd" required name="password"
                            minlength="6" maxlength="12" enterkeyhint="next">
                        <button type="button" id="passToggle" aria-label="Show password toggle">
                            <span class="icon" data-icon="eye"></span>
                        </button>
                    </div>
                </label>

                <label for="confirm_password">
                    <div class="label">
                        <span class="icon" data-icon="lock"></span>
                        Confirm Password:
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassInput" placeholder="[Password]" required
                            name="confirmedPassword" minlength="6" maxlength="12" enterkeyhint="done">
                        <button type="button" id="confirmPassToggle" aria-label="Show password toggle">
                            <span class="icon" data-icon="eye"></span>
                        </button>
                    </div>
                </label>

                <button type="submit" class="formBtn" id="submit">
                    <span class="btn">Submit</span>
                </button>
            </form>
        </section>
    </main>

</body>

<script src="./crud_form.js" type="module" defer></script>

</html>
