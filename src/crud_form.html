<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CRUD App Form</title>
</head>
<style>
    *::before,
    *::after,
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
    }

    :root {
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    /*body {
        display: flex;
        justify-content: center;
    }*/

    section {
        display: flex;
        align-items: center;
        height: 100vh;
    }

    input[type="checkbox"] {
        accent-color: hsl(220, 80%, 50%);
        width: 1rem;
    }

    input[type="checkbox"]:focus {
        outline: 1px solid hsl(0, 0%, 0%);
    }

    .textError {
        font-size: .85rem;
        font-weight: 400;
        color: hsl(0, 80%, 50%);
    }

    form {
        display: grid;
        grid-template-columns: repeat(1, auto);
        max-width: 100%;
        width: 450px;
        padding: 3em 3em 3em;
        border-radius: .5rem;
        gap: 1.25rem;
        box-shadow: var(--shadow);
        margin: auto;
    }

    button:not(button[type="button"]) {
        border: none;
        border-radius: .5rem;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        cursor: pointer;
        background: hsl(210, 80%, 5%);
        color: hsl(0, 0%, 100%);
        transition: .3s ease;
    }

    button:not(button[type="button"]):hover {
        background: hsl(0, 0%, 15%);
    }

    input {
        border: 1px solid hsl(0, 0%, 80%);
        border-radius: .25rem;
        padding: .5em 1em;
        height: 2.5rem;
        outline: none;
        width: 100%;
        transition: .3s ease;
    }

    input:not(input[type="radio"]):focus,
    input:not(input[type="radio"]):hover {
        scale: 1.02;
        outline: 1px solid hsl(220, 80%, 5%);
        outline-offset: 1px;
    }

    label {
        display: flex;
        flex-direction: column;
        gap: .5rem;
    }

    input.error {
        outline: 1px solid hsl(0, 80%, 50%);
    }

    input:not(input[type="radio"]).error:focus,
    input:not(input[type="radio"]).error:hover {
        outline: 1px solid hsl(0, 80%, 50%);
    }

    input.error {
        outline: 1px solid hsl(0, 80%, 50%);
    }

    .label {
        display: flex;
        align-items: center;
        gap: .5rem;
    }

    .lucide {
        opacity: .4;
        width: 1.25rem;
        height: 1.25rem;
        vertical-align: baseline;
    }

    .input-wrapper {
        position: relative;
    }

    button[type="button"] {
        vertical-align: middle;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        position: absolute;
    }

    textarea{
        width: 100%;
    }
    
    .popover {
        max-width: 100%;
        width: 400px;
        box-shadow: var(--shadow);
        padding: 1em 2em;
        border: none;
        outline: 2px solid hsl(100, 80%, 50%);
        outline-offset: 2px;
        color: hsl(100, 100%, 20%);
        background: hsl(100, 80%, 65%);
        margin: 0 auto;
        border-radius: .25rem;
        animation: popOver .3s ease forwards;
        transform: translateY(-100%) scale(0);
    }

    .toast {
        display: flex;
        align-items: center;
        gap: .75rem;
    }

    @keyframes popOver {
        100% {
            transform: translateY(1.25rem) scale(1)
        }
    }

    .popover.close {
        animation: popOut .3s ease forwards;
    }

    @keyframes popOut {
        0% {
            transform: translateY(0) scale(1);
        }

        100% {
            transform: translateY(-100%) scale(0);
        }
    }

    .toastBtn {
        background: none;
        border: none;
    }

    .icon-close {
        width: 1rem;
        height: 1rem;
        color: hsl(0, 0%, 8%, .8);
    }

    .icon-check {
        color: hsl(100, 100%, 20%);
    }

    .toast-content {
        display: flex;
        align-items: start;
        flex-direction: column;
        gap: .5rem;
    }

    strong {
        font-size: 1.25rem;
    }

</style>

<body>
    <main>
        <section>
            <form action="/" method="get" target="_self" spellcheck="true" autocomplete="off"
                enctype="application/x-www-form-urlencoded">
                <label for="name">
                    <div class="label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-user">
                            <path d="M17.925 20.056a6 6 0 0 0-11.851.001" />
                            <circle cx="12" cy="11" r="4" />
                            <circle cx="12" cy="12" r="10" />
                        </svg>
                        Name:
                    </div>
                    <input type="text" id="name" placeholder="John Doe" required name="Name" autofocus
                        enterkeyhint="next">
                </label>

                <label for="email">
                    <div class="label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-mail-icon lucide-mail">
                            <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                        </svg>
                        E-mail:
                    </div>
                    <input type="email" id="email" placeholder="Your_email@gmail.com" required name="E-mail"
                        enterkeyhint="next" inputmode="email">
                </label>
                
                <label for="dob">
                        <div class="label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-calendar-days-icon lucide-calendar-days">
                                <path d="M8 2v4" />
                                <path d="M16 2v4" />
                                <rect width="18" height="18" x="3" y="4" rx="2" />
                                <path d="M3 10h18" />
                                <path d="M8 14h.01" />
                                <path d="M12 14h.01" />
                                <path d="M16 14h.01" />
                                <path d="M8 18h.01" />
                                <path d="M12 18h.01" />
                                <path d="M16 18h.01" />
                            </svg>
                            Date of Birth:
                        </div>
                        <input type="date" id="dob" placeholder="DD-MM-YYYY" required name="date" enterkeyhint="next">
                    </label>
 
                    <label for="password">
                        <div class="label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                <circle cx="12" cy="16" r="1" />
                                <rect x="3" y="10" width="18" height="12" rx="2" />
                                <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                            </svg>
                            Password:
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="P@$sw0rd" required name="Password" minlength="6"
                                maxlength="12" enterkeyhint="next">
                            <button type="button" id="pass_toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-eye-icon lucide-eye">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </label>
                    
                    <label for="confirm_password">
                        <div class="label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                <circle cx="12" cy="16" r="1" />
                                <rect x="3" y="10" width="18" height="12" rx="2" />
                                <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                            </svg>
                            Confirm Password:
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="confirm_password" placeholder="[Password]" required name="confirm_password"
                                minlength="6" maxlength="12" enterkeyhint="done">
                            <button type="button" id="confirmPass_toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-eye">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </label>
            
                <button type="submit" id="submit">Submit</button>
            </form>
        </section>
    </main>

    <script src="/src/js/crud_form.js"></script>
</body>

</html>
