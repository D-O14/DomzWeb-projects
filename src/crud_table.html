<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CRUD App Table</title>
</head>
<style>
    *::before,
    *::after,
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui;
        transition: .3s ease;
    }

    :root{
        --shadow:
            0 4px 6px hsla(0, 0%, 0%, 5%),
            0 10px 20px hsla(0, 0%, 0%, 1%),
            0 20px 40px hsla(0, 0%, 0%, 15%);
    }

    section{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    button {
        border: 2px solid transparent;
        border-radius: 1.25rem;
        font-size: 1rem;
        font-weight: 600;
        padding: .5em 1em;
        cursor: pointer;
        color: hsl(0, 0%, 90%);
        background: hsl(0, 0%, 8%);
    }

    button:hover{
        background: hsl(0, 0%, 8%, .8);
    }

    a{
        text-decoration: none;
        color: hsl(220, 80%, 50%);
        font-weight: 500;
    }

    table {
        max-width: 100%;
        border-collapse: collapse;
        border-radius: .75rem;
        background: hsl(0, 0%, 100%);
        overflow: hidden;
    }

    thead {
        background: hsl(210, 40%, 98%);
    }

    th {
        text-align: center;
        padding: .9em;
        font-size: .9em;
        color: hsl(220, 9%, 46%);
        text-transform: uppercase;
        letter-spacing: .05em;
        font-weight: 500;
    }

    td:not(.badge) {
        padding: .9em;
        border-top: 1px solid hsl(220, 13%, 91%);
        font-size: .9em;
    }

    tr:hover{
        background: hsl(210, 20%, 98%);
    }

    tr:nth-of-type(even){
        background: hsl(0, 0%, 99%);
    }

    .actions{
        display: flex;
        gap: .5rem;
    }

    .btn{
        border: none;
        padding: .5em 1em;
        border-radius: .5em;
        font-weight: 500;
    }

    .btn.edit{
        background: hsl(204, 94%, 94%);
        color: hsl(201, 96%, 32%);
    }

    .btn.delete{
        background: hsl(0, 93%, 94%);
        color: hsl(0, 74%, 42%);
    }

    .lucide{
        width: 1.25em;
        height: 1.25em;
    }

    /*.badge{
        padding: .25em .65em;
        border-radius: .5rem;
        font-size: .75em;
        font-weight: 500;
        background: hsl(204, 94%, 94%);
        color: hsl(201, 96%, 32%);
    }*/

    .id{
        color: hsl(220, 9%, 46%);
        max-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    input[type="checkbox"]{
        accent-color: hsl(221, 96%, 52%);
        cursor: pointer;
    }

    .table-container{
        padding: 1.25em;
        background: hsl(210, 40%, 96%);
        border-radius: .75em;
    }
    
    :modal {
        border: none;
        padding: 2em 2em 2em;
        margin: auto;
        box-shadow: var(--shadow);
        border-radius: .5rem;
    }

    :modal[open] {
		animation: slideIn .3s ease-out forwards;
	}

    @keyframes slideIn{
        0%{transform: translateY(-100%);}
        100%{transform: translateY(0);}
    }

    ::backdrop {
        background: hsla(0, 0%, 8%, .8);
        -webkit-backdrop-filter: blur(2px);
		backdrop-filter: blur(2px);
    }

    .modal {
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: .5rem;
    }

    .message {
        padding-bottom: 1em;
    }

    .message-content {
        color: hsl(0, 0%, 50%);
        letter-spacing: .5px;
        line-height: 1.5;
    }

    .close {
        border-radius: 1.25rem;
        background: hsl(0, 75%, 50%);
        color: hsl(0, 0%, 90%);
        transition: .3s ease;
    }

    .close:hover{
        background: hsl(0, 75%, 45%);
        outline: 2px solid hsl(0, 75%, 50%);
        outline-offset: 2px;
    }

    .exit {
        border-radius: 1.25rem;
        transition: .3s ease;
    }

    .exit:hover{
        outline: 2px solid hsl(0, 0%, 90%);
        outline-offset: 2px;
    }

    menu {
        display: flex;
        gap: .5rem;
        justify-content: flex-end;
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: .5px;
    }

    form {
        display: grid;
        grid-template-columns: repeat(1, auto);
        max-width: 100%;
        width: 425px;
        gap: 1rem;
    }

    input:not(input[type="checkbox"]) {
        border: 1px solid hsl(0, 0%, 80%);
        border-radius: .25rem;
        padding: .5rem 1rem;
        width: 100%;
        height: 40px;
        outline: none;
    }

    input:not(input[type="checkbox"], input[type="radio"]):focus, 
    input:not(input[type="checkbox"], input[type="radio"]):hover {
        scale: 1.02;
        outline: 2px solid hsl(0, 0%, 5%);
        outline-offset: 1px;
    }

    label {
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: .5rem;
    }

    .editModal{
        border: none;
        border-radius: .5rem;
        margin: auto;
        padding: 3em 3em 3em;   
    }

    
    .popover {

        max-width: 100%;
        width: 400px;
        box-shadow: var(--shadow);
        padding: 1em 2em;
        border: none;
        outline: 2px solid hsl(100, 80%, 50%);
        outline-offset: 2px;
        color: hsl(100, 100%, 20%);
        background: hsl(100, 80%, 65%);
        margin: 0 auto;
        border-radius: .25rem;
        animation: popOver .3s ease forwards;
        transform: translateY(-100%) scale(0);
    }

    .toast {
        display: flex;
        align-items: center;
        gap: .75rem;
    }

    @keyframes popOver {
        100% {
            transform: translateY(1.25rem) scale(1)
        }
    }

    .popover.close {
        animation: popOut .3s ease forwards;
    }

    @keyframes popOut {
        0% {
            transform: translateY(0) scale(1);
        }

        100% {
            transform: translateY(-100%) scale(0);
        }
    }

    .toastBtn {
        background: none;
        border: none;
    }

    .icon-close {
        width: 1rem;
        height: 1rem;
        color: hsl(0, 0%, 8%, .8);
    }

    .icon-check {
        color: hsl(100, 100%, 20%);
    }

    .toast-content {
        display: flex;
        align-items: start;
        flex-direction: column;
        gap: .5rem;
    }

    strong {
        font-size: 1.25rem;
    }
</style>
<body>
    <main>
        <section id="section">
            <div class="table-container">
                <table class="table">
                    <thead class="header">
                        <th>Select</th>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Date Of birth</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Company</th>
                        <th>Options</th>
                    </thead>
                    <tbody class="body" id="body">
                
                    </tbody>
                    </table>
            </div>
        </section>
    </main>    
</body>

<script src="/src/js/crud_table.js"></script>
</html>
