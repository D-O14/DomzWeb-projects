<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="wrapper">
        <h1>Sign Up
            <form action="">
                <div>
                    <input type="text" name="name" id="name-input" placeholder="Enter your name">
                </div>
                
                <div>
                    <input type="email" name="email" id="email-input" placeholder="Enter your e-mail">
                </div>

                <div>
                    <input type="password" name="password" id="password-input" placeholder="Enter a password">
                </div>

                <div>
                    <input type="password" name="repeat-password" id="repeat-password-input" placeholder="Confirm password">
                </div>
                
            </form>
        </h1>
    </div>
</body>
</html>
