<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Asimovian&family=DM+Serif+Text:ital@0;1&family=Electrolize&family=Paprika&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/form.css">
</head>

<body>
    <div class="wrapper">
        <h1>Login</h1>
        <div class="message">
            <div class="message-content">
                <strong id="error"></strong>
            </div>
        </div>
        <form action="" id="form">
    
            <div>
                <label for="email-input">
                    <svg xmlns="http://www.w3.org/2000/svg" width="45" height="50" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-at">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                        <path d="M16 12v1.5a2.5 2.5 0 0 0 5 0v-1.5a9 9 0 1 0 -5.5 8.28" />
                    </svg>
                </label>
                <input type="email" name="email" id="email-input" placeholder="Enter your E-mail" autocomplete="off">
            </div>

            <div>
                <label for="password-input">
                    <svg xmlns="http://www.w3.org/2000/svg" width="45" height="50" viewBox="0 0 24 24"
                        class="icon icon-tabler icons-tabler-filled icon-tabler-lock">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                            d="M12 2a5 5 0 0 1 5 5v3a3 3 0 0 1 3 3v6a3 3 0 0 1 -3 3h-10a3 3 0 0 1 -3 -3v-6a3 3 0 0 1 3 -3v-3a5 5 0 0 1 5 -5m0 12a2 2 0 0 0 -1.995 1.85l-.005 .15a2 2 0 1 0 2 -2m0 -10a3 3 0 0 0 -3 3v3h6v-3a3 3 0 0 0 -3 -3" />
                    </svg>
                </label>
                <input type="password" name="password" id="password-input" placeholder="Enter a password">
            </div>

            <button type="submit" id="mySubmit">Login</button>

        </form>
        <p>Don't' have an account yet? <a href="/src/form.html">Sign Up</a></p>
    </div>

    <script src="/src/js/form.js"></script>
</body>

</html>
