<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="preload" as="style" onload="this.rel = 'stylesheet'" href="/src/css/todo.css">
</head>
<body>
    <main>
        <form action="" autocomplete="off">
            <input type="text" name="toDoListInput" placeholder="Write out your task">
            <button class="addBtn">Add Task</button>
        </form>
        
        <div class="container">

            <template>
                <div class="todo" data-id="">
                    <input type="checkbox" class="check">
                    <div class="list-wrapper">
                        <p class="list" contenteditable="true"></p>
                        <span class="date"></span>
                    </div>
                    <button class="del" aria-label="delete button"></button>
                </div>
            </template>
            
        </div>

    </main>
    
</body>

<script src="/src/js/todo.js" defer type="module"></script>
</html>
